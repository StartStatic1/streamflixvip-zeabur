<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historias — StreamFlixVIP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#08080f;--surface:#111119;--surface2:#1a1a26;--border:rgba(255,255,255,.08);--text:#f0f0f8;--muted:#8888aa;--gold:#f5c518;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
    header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
    header a{color:var(--gold);text-decoration:none;font-size:.85rem}
    main{max-width:980px;margin:0 auto;padding:20px}
    input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;margin-bottom:8px}
    textarea{min-height:90px;font-size:.8rem}
    button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-weight:700}
    .btn-gold{background:linear-gradient(135deg,var(--gold),#e6a800);color:#000}
    .btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-red{background:#3a1212;color:#ffb4b4}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
    .muted{color:var(--muted);font-size:.8rem}
    .ok{color:var(--green)}
    h2{font-size:1.05rem;margin:18px 0 10px}
    #csvFile{padding:8px}
    #progress{margin:8px 0;font-size:.9rem}
  </style>
</head>
<body>
<header>
  <strong>Historias verticais</strong>
  <div>
    <a href="/admin-addons.html">Add-ons</a>
    &nbsp;·&nbsp;
    <a href="/admin.html">Painel</a>
  </div>
</header>
<main>
  <p class="muted">Uma historia + EPs. 1 URL longa = historia completa.</p>
  <div id="msg" class="muted"></div>
  <div id="progress" class="ok"></div>
  <h2>Importar CSV</h2>
  <p class="muted">1 escolhe o arquivo. 2 toca Enviar arquivo. Nao fecha a aba.</p>
  <input id="csvFile" type="file" accept=".csv,text/csv,text/plain"/>
  <div class="row">
    <input id="csvLimit" value="40" style="width:80px"/>
    <button class="btn-gold" type="button" onclick="startFileImport()">Enviar arquivo</button>
  </div>
  <details style="margin:10px 0">
    <summary class="muted">Ou colar um pedaco</summary>
    <textarea id="csvBox" placeholder="nome,idioma,link_imagem,link_mp4"></textarea>
    <button class="btn-sec" type="button" onclick="importPasted()">Importar texto</button>
  </details>
  <h2>Nova historia</h2>
  <input id="title" placeholder="Titulo"/>
  <input id="subtitle" placeholder="Subtitulo"/>
  <input id="poster" placeholder="URL da capa"/>
  <div class="row">
    <input id="genre" placeholder="Genero" style="flex:1"/>
    <input id="lang" value="pt-BR" style="width:120px"/>
  </div>
  <label class="muted"><input type="checkbox" id="vip" checked/> so VIP</label>
  <label class="muted"><input type="checkbox" id="addons" checked/> usar add-ons</label>
  <div class="row"><button class="btn-gold" onclick="saveStory()">Salvar historia</button></div>
  <h2>Lista</h2>
  <div id="list"></div>
  <div id="epsBox" style="display:none">
    <h2 id="epsTitle">Episodios</h2>
    <div class="row">
      <input id="epn" placeholder="EP" style="width:80px"/>
      <input id="ept" placeholder="Titulo do EP" style="flex:1"/>
    </div>
    <input id="epu" placeholder="URL do video"/>
    <button class="btn-gold" onclick="saveEp()">Adicionar EP</button>
    <textarea id="m3u" placeholder="#EXTINF"></textarea>
    <button class="btn-sec" onclick="importM3u()">Importar M3U</button>
    <div id="eps"></div>
  </div>
</main>
<script>
const SUPABASE_URL = 'https://gkujbjpvphuvrejpvvtz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdWpianB2cGh1dnJlanB2dnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTQ2OTMsImV4cCI6MjA5NDI3MDY5M30.Zoqdn0V6SZOAfhz9kK9NgG6lniJdyVqihLsNT-O8Huw';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sfv-admin-auth-token', storage: window.localStorage }
});
let token = '';
let currentStory = null;
let importing = false;
function msg(t, ok) {
  const e = document.getElementById('msg');
  e.textContent = t || '';
  e.className = ok ? 'ok' : 'muted';
}
function prog(t) { document.getElementById('progress').textContent = t || ''; }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' })[c];
  });
}
async function api(action, extra) {
  extra = extra || {}; extra.action = action;
  const r = await fetch('/api/admin-reels', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(extra),
  });
  return r.json();
}
async function boot() {
  const sess = await db.auth.getSession();
  token = sess.data && sess.data.session && sess.data.session.access_token;
  if (!token) { location.href = '/admin.html'; return; }
  await load();
}
async function load() {
  const data = await api('list');
  if (data.error) { msg(String(data.error.message || data.error)); return; }
  const wrap = document.getElementById('list');
  const rows = data.stories || [];
  wrap.innerHTML = rows.map(function (s) {
    return '<div class="card"><strong>' + esc(s.title) + '</strong><div class="muted">' +
      (s.episode_count || 0) + ' EPs</div><div class="row">' +
      '<button class="btn-sec" data-id="' + s.id + '" data-title="' + esc(s.title) + '" onclick="openEps(this.dataset.id,this.dataset.title)">Episodios</button>' +
      '<button class="btn-red" data-id="' + s.id + '" onclick="delStory(this.dataset.id)">Excluir</button></div></div>';
  }).join('') || '<p class="muted">Nenhuma historia ainda.</p>';
}
function splitCsvLines(text) {
  return String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
}
async function importCsvText(text) {
  if (importing) { msg('Ja esta enviando.'); return; }
  const lines = splitCsvLines(text);
  if (lines.length < 2) { msg('CSV vazio.'); return; }
  const header = lines[0];
  const rows = lines.slice(1);
  const batch = Math.min(Math.max(Number(document.getElementById('csvLimit').value || 40), 10), 60);
  importing = true;
  let created = 0, skipped = 0, failed = 0;
  try {
    for (let i = 0; i < rows.length; i += batch) {
      const part = rows.slice(i, i + batch);
      prog('Enviando ' + (i + 1) + '-' + (i + part.length) + ' de ' + rows.length);
      const data = await api('import_csv', { csv: [header].concat(part).join('\n'), limit: batch });
      if (data.error) { msg('Parou: ' + JSON.stringify(data.error)); importing = false; return; }
      created += Number(data.created || 0);
      skipped += Number(data.skipped || 0);
      failed += Number(data.failed || 0);
    }
    prog('');
    msg('Pronto. Criadas ' + created + ' · puladas ' + skipped + ' · falhas ' + failed, true);
    await load();
  } finally { importing = false; }
}
async function startFileImport() {
  const f = document.getElementById('csvFile').files && document.getElementById('csvFile').files[0];
  if (!f) { msg('Escolhe o CSV primeiro.'); return; }
  msg('Lendo ' + f.name + '...');
  await importCsvText(await f.text());
}
async function importPasted() { await importCsvText(document.getElementById('csvBox').value); }
async function saveStory() {
  const data = await api('save_story', {
    title: document.getElementById('title').value,
    subtitle: document.getElementById('subtitle').value,
    poster_url: document.getElementById('poster').value,
    genre: document.getElementById('genre').value,
    language: document.getElementById('lang').value,
    vip_only: document.getElementById('vip').checked,
    use_addons: document.getElementById('addons').checked,
    is_active: true,
  });
  if (data.error) { msg(JSON.stringify(data.error)); return; }
  msg('Historia salva', true); await load();
}
async function delStory(id) {
  if (!confirm('Excluir?')) return;
  await api('delete_story', { id: id }); currentStory = null;
  document.getElementById('epsBox').style.display = 'none'; await load();
}
async function openEps(id, title) {
  currentStory = id;
  document.getElementById('epsBox').style.display = 'block';
  document.getElementById('epsTitle').textContent = 'EPs — ' + title;
  const data = await api('list_episodes', { story_id: id });
  document.getElementById('eps').innerHTML = (data.episodes || []).map(function (e) {
    return '<div class="card"><strong>EP ' + e.episode + '</strong> ' + esc(e.title || '') +
      '<div class="muted">' + esc((e.video_url || '').slice(0, 90)) + '</div>' +
      '<button class="btn-red" data-id="' + e.id + '" onclick="delEp(this.dataset.id)">Excluir EP</button></div>';
  }).join('') || '<p class="muted">Sem EPs.</p>';
}
async function saveEp() {
  if (!currentStory) return;
  const data = await api('save_episode', {
    story_id: currentStory,
    episode: Number(document.getElementById('epn').value || 0),
    title: document.getElementById('ept').value,
    video_url: document.getElementById('epu').value,
  });
  if (data.error) { msg(JSON.stringify(data.error)); return; }
  await openEps(currentStory, document.getElementById('epsTitle').textContent.replace(/^EPs — /, ''));
}
function parseM3u(raw) {
  const lines = String(raw || '').split(/\r?\n/); const out = []; let meta = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('#EXTINF') === 0) { meta = line; continue; }
    if (line.charAt(0) === '#') continue;
    if (!/^https?:\/\//i.test(line)) continue;
    const title = meta.indexOf(',') >= 0 ? meta.slice(meta.lastIndexOf(',') + 1).trim() : '';
    const epm = /(?:EP|E)\s*0*(\d+)/i.exec(title);
    out.push({ title: title, url: line, episode: epm ? Number(epm[1]) : out.length + 1 }); meta = '';
  }
  return out;
}
async function importM3u() {
  if (!currentStory) return;
  const items = parseM3u(document.getElementById('m3u').value);
  if (!items.length) { msg('Nenhum EP.'); return; }
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const data = await api('save_episode', { story_id: currentStory, episode: it.episode, title: it.title, video_url: it.url });
    if (data.error) { msg(JSON.stringify(data.error)); return; }
  }
  msg(items.length + ' EPs', true);
  await openEps(currentStory, document.getElementById('epsTitle').textContent.replace(/^EPs — /, ''));
}
async function delEp(id) {
  await api('delete_episode', { id: id });
  await openEps(currentStory, document.getElementById('epsTitle').textContent.replace(/^EPs — /, ''));
}
boot();
</script>
</body>
</html>
