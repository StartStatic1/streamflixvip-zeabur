<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Testar API Parceiro — StreamFlixVIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#08080f; --surface:#111119; --surface2:#1a1a26; --border:rgba(255,255,255,.08);
      --text:#f0f0f8; --muted:#8888aa; --gold:#f5c518; --green:#22c55e; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20px 14px 40px}
    .wrap{max-width:720px;margin:0 auto}
    h1{font-size:1.2rem;margin-bottom:6px}
    .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
    label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
    input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font:inherit;margin-bottom:12px}
    button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 16px;font-weight:700;margin-right:8px;margin-bottom:8px}
    .btn-gold{background:linear-gradient(135deg,var(--gold),#e6a800);color:#000}
    .btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row > div{flex:1;min-width:120px}
    pre{background:#0c0c14;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:.75rem;overflow:auto;max-height:420px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
    .status{font-size:.85rem;margin-bottom:8px}
    .ok{color:var(--green)}.err{color:var(--red)}
    a{color:var(--gold);text-decoration:none;font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Testar API de parceiro</h1>
    <p class="sub">Cola o token <code>sf_live_...</code> e testa ping / sources / catalog. Não precisa de login admin.</p>
    <p style="margin-bottom:16px"><a href="/admin-api.html">← Painel de parceiros</a></p>

    <div class="panel">
      <label for="token">Token (Bearer)</label>
      <input id="token" type="password" placeholder="sf_live_..." autocomplete="off"/>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer">
        <input type="checkbox" id="showTok" onchange="document.getElementById('token').type=this.checked?'text':'password'"/>
        <span style="color:var(--muted);font-size:.8rem">Mostrar token</span>
      </label>

      <label>Ação</label>
      <select id="action" onchange="toggleFields()">
        <option value="ping">ping</option>
        <option value="sources">sources</option>
        <option value="catalog">catalog</option>
        <option value="livetv">livetv</option>
      </select>

      <div id="srcFields" style="display:none">
        <div class="row">
          <div>
            <label>tmdb_id</label>
            <input id="tmdb" type="number" value="550" placeholder="550"/>
          </div>
          <div>
            <label>type</label>
            <select id="type">
              <option value="movie">movie</option>
              <option value="tv">tv</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>season (só tv)</label>
            <input id="season" type="number" placeholder="1"/>
          </div>
          <div>
            <label>episode (só tv)</label>
            <input id="episode" type="number" placeholder="1"/>
          </div>
        </div>
      </div>

      <div id="catFields" style="display:none">
        <div class="row">
          <div>
            <label>type</label>
            <select id="catType">
              <option value="movie">movie</option>
              <option value="tv">tv</option>
              <option value="all">all</option>
            </select>
          </div>
          <div>
            <label>limit</label>
            <input id="limit" type="number" value="20" min="1" max="100"/>
          </div>
        </div>
      </div>

      <button class="btn-gold" id="btnRun" onclick="runTest()">Testar</button>
      <button class="btn-sec" onclick="clearOut()">Limpar</button>
    </div>

    <div class="panel">
      <div class="status" id="status">Aguardando…</div>
      <pre id="out">{}</pre>
    </div>
  </div>

<script>
const base = location.origin;

try {
  const k = sessionStorage.getItem('sf_partner_test_key');
  if (k) document.getElementById('token').value = k;
} catch (_) {}

function toggleFields() {
  const a = document.getElementById('action').value;
  document.getElementById('srcFields').style.display = a === 'sources' ? 'block' : 'none';
  document.getElementById('catFields').style.display = a === 'catalog' ? 'block' : 'none';
}

function clearOut() {
  document.getElementById('out').textContent = '{}';
  document.getElementById('status').textContent = 'Aguardando…';
  document.getElementById('status').className = 'status';
}

async function runTest() {
  const token = document.getElementById('token').value.trim();
  if (!token) {
    document.getElementById('status').textContent = 'Cole o token';
    document.getElementById('status').className = 'status err';
    return;
  }
  const action = document.getElementById('action').value;
  let url = base + '/api/partner?action=' + encodeURIComponent(action);
  if (action === 'sources') {
    const tmdb = document.getElementById('tmdb').value.trim();
    const type = document.getElementById('type').value;
    url += '&tmdb_id=' + encodeURIComponent(tmdb) + '&type=' + encodeURIComponent(type);
    const se = document.getElementById('season').value.trim();
    const ep = document.getElementById('episode').value.trim();
    if (se) url += '&season=' + encodeURIComponent(se);
    if (ep) url += '&episode=' + encodeURIComponent(ep);
  }
  if (action === 'catalog') {
    url += '&type=' + encodeURIComponent(document.getElementById('catType').value);
    url += '&limit=' + encodeURIComponent(document.getElementById('limit').value || '20');
  }

  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Chamando…';
  document.getElementById('status').className = 'status';
  document.getElementById('out').textContent = '…';

  try {
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        Authorization: 'Bearer ' + token,
        Accept: 'application/json',
      },
    });
    const text = await res.text();
    let body;
    try { body = JSON.parse(text); } catch (_) { body = text; }
    document.getElementById('out').textContent =
      typeof body === 'string' ? body : JSON.stringify(body, null, 2);
    const st = document.getElementById('status');
    st.textContent = res.status + ' ' + res.statusText + ' · ' + url.replace(base, '');
    st.className = 'status ' + (res.ok ? 'ok' : 'err');
    try { sessionStorage.setItem('sf_partner_test_key', token); } catch (_) {}
  } catch (e) {
    document.getElementById('status').textContent = 'Erro de rede: ' + (e.message || e);
    document.getElementById('status').className = 'status err';
    document.getElementById('out').textContent = String(e);
  } finally {
    btn.disabled = false;
  }
}

toggleFields();
</script>
</body>
</html>
