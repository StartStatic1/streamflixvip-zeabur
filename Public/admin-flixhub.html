<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlixHub · agregador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0b0f1a; --card:#12182a; --border:#1e2a45; --text:#e8eefc; --muted:#8b9bb8; --gold:#f5c518; --green:#3ddc97; --red:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
    header a { color:var(--muted); text-decoration:none; margin-right:10px; font-size:.85rem; }
    header a:hover { color:var(--gold); }
    .logo { font-weight:700; } .logo span { color:var(--gold); }
    main { max-width:720px; margin:0 auto; padding:16px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
    h2 { margin:0 0 10px; font-size:1.1rem; }
    .hint { color:var(--muted); font-size:.8rem; margin:6px 0 10px; }
    input, textarea, select { width:100%; background:#0a1020; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; margin:4px 0 8px; font-size:.9rem; }
    .btn-gold { background:var(--gold); color:#111; border:none; border-radius:10px; padding:12px 16px; font-weight:700; cursor:pointer; }
    .btn-sec { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; cursor:pointer; }
    .btn-danger { background:transparent; border:1px solid var(--red); color:var(--red); border-radius:10px; padding:8px 12px; cursor:pointer; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .srv { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:#0d1424; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    .chip { width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:#0a1020; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .chip.on { border-color:var(--gold); }
    .item { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
    .meta { color:var(--muted); font-size:.75rem; word-break:break-all; margin-top:4px; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1a2338; border:1px solid var(--border); padding:10px 16px; border-radius:10px; z-index:99; font-size:.85rem; }
    label.chk { display:inline-flex; align-items:center; gap:6px; margin-right:12px; font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Flix<span>Hub</span> · agregador</div>
    <div>
      <a href="/admin-hub.html">Hub</a>
      <a href="/admin-bridge.html">Bridge</a>
      <a href="/admin.html">Painel</a>
      <button class="btn-sec" style="padding:6px 12px;font-size:.8rem" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <main>
    <div class="panel">
      <h2 id="formTitle">Novo pack</h2>
      <p class="hint">Cole get.php → Separar. Use <b>Pastas</b> para filtrar. Vazio = todas. Rascunho salva sozinho no navegador.</p>
      <input id="pName" placeholder="Nome no Nuvio — ex: FlixHub" value="FlixHub"/>
      <p class="hint"><b>Colar link get.php / M3U</b></p>
      <textarea id="pasteBox" rows="2" placeholder="http://host/get.php?username=xx&password=yy"></textarea>
      <button class="btn-sec" style="margin-bottom:10px" onclick="parsePaste()">Separar e adicionar</button>
      <div id="srvBox"></div>
      <button class="btn-sec" style="margin-bottom:12px" onclick="addSrv()">+ Servidor manual</button>
      <label class="hint" style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer">
        <input type="checkbox" id="pPublic" style="width:18px;height:18px"/>
        <span><b>Também link público</b> (sem token na URL)</span>
      </label>
      <div class="row">
        <button class="btn-gold" style="flex:1" onclick="save()" id="btnSave">Salvar e gerar</button>
        <button class="btn-sec" style="display:none" id="btnCancel" onclick="cancelEdit()">Cancelar</button>
      </div>
    </div>
    <div class="panel">
      <h2>Packs <button class="btn-sec" style="padding:4px 10px;font-size:.75rem;margin-left:8px" onclick="loadList()">Atualizar</button></h2>
      <div id="list"><p class="hint">Carregando…</p></div>
    </div>
  </main>
  <div id="toast" class="toast" style="display:none"></div>
  <script>
const SUPABASE_URL = 'https://gkujbjpvphuvrejpvvtz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdWpianB2cGh1dnJlanB2dnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTQ2OTMsImV4cCI6MjA5NDI3MDY5M30.Zoqdn0V6SZOAfhz9kK9NgG6lniJdyVqihLsNT-O8Huw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sfv-admin-auth-token' },
});
let _session = null;
let _servers = [];
let _editId = null;
let _packs = [];
const EMOJIS = ['🔴','🔵','🟢','🟣','🟠','🟡','⚡','🔥','💎','🎬','📺','⭐','🚀','💜','🖤','🤍'];

function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2800);
}
function esc(s) {
  return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}
async function ensureSession() {
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { _session = data.session; return _session; }
  } catch (_) {}
  try {
    const { data, error } = await sb.auth.refreshSession();
    if (!error && data && data.session) { _session = data.session; return _session; }
  } catch (_) {}
  return null;
}
async function api(action, body) {
  let sess = await ensureSession();
  if (!sess || !sess.access_token) return { error: 'Sessao invalida — saia e entre de novo no painel' };
  try {
    let r = await fetch('/api/admin-flixhub', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token },
      body: JSON.stringify(Object.assign({ action }, body || {})),
    });
    if (r.status === 401) {
      sess = await ensureSession();
      if (!sess) return { error: 'Sessao invalida — saia e entre de novo no painel' };
      r = await fetch('/api/admin-flixhub', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token },
        body: JSON.stringify(Object.assign({ action }, body || {})),
      });
    }
    const j = await r.json().catch(() => ({ error: 'JSON invalido HTTP ' + r.status }));
    if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
    return j;
  } catch (e) {
    return { error: String(e && e.message ? e.message : e) };
  }
}
function saveDraft() {
  try {
    localStorage.setItem('flixhub_draft', JSON.stringify({
      name: (document.getElementById('pName') || {}).value || 'FlixHub',
      public_enabled: !!(document.getElementById('pPublic') || {}).checked,
      editId: _editId,
      servers: _servers,
      at: Date.now(),
    }));
  } catch (_) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem('flixhub_draft');
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.servers) || !d.servers.length) return false;
    if (d.at && Date.now() - d.at > 7 * 24 * 3600 * 1000) return false;
    if (!confirm('Ha um rascunho nao salvo (' + d.servers.length + ' servidor(es)). Recuperar?')) {
      localStorage.removeItem('flixhub_draft');
      return false;
    }
    _editId = d.editId || null;
    document.getElementById('pName').value = d.name || 'FlixHub';
    document.getElementById('pPublic').checked = !!d.public_enabled;
    if (_editId) {
      document.getElementById('formTitle').textContent = 'Editar pack';
      document.getElementById('btnSave').textContent = 'Salvar alteracoes';
      document.getElementById('btnCancel').style.display = 'inline-block';
    }
    _servers = d.servers;
    renderSrvs();
    toast('Rascunho recuperado — clique Salvar');
    return true;
  } catch (_) { return false; }
}
function clearDraft() {
  try { localStorage.removeItem('flixhub_draft'); } catch (_) {}
}
async function doLogout() {
  clearDraft();
  await sb.auth.signOut();
  location.href = '/admin.html';
}
function parsePaste() {
  const raw = document.getElementById('pasteBox').value.trim();
  if (!raw) return;
  try {
    let host = '', user = '', pass = '';
    if (raw.includes('get.php') || raw.includes('username=')) {
      const u = new URL(raw.startsWith('http') ? raw : 'http://x/?' + raw);
      host = u.origin;
      user = u.searchParams.get('username') || '';
      pass = u.searchParams.get('password') || '';
    } else if (raw.includes('://')) {
      host = new URL(raw).origin;
    }
    if (host) {
      let label = 'Servidor ' + (_servers.length + 1);
      try { label = new URL(host).hostname.replace(/^www\./,'') || label; } catch(_) {}
      _servers.push({ id: 's' + Date.now(), name: label, color: '⚡', host, user, pass, enabled: true, priority: _servers.length + 1, use_movies: true, use_series: true, vod_category_ids: [], series_category_ids: [] });
      renderSrvs();
      document.getElementById('pasteBox').value = '';
      toast('Servidor adicionado');
    } else toast('Nao reconheci o link');
  } catch (e) { toast('Erro ao parsear'); }
}
function addSrv() {
  _servers.push({ id: 's' + Date.now(), name: 'Servidor ' + (_servers.length + 1), color: '⚡', host: '', user: '', pass: '', enabled: true, priority: _servers.length + 1, use_movies: true, use_series: true, vod_category_ids: [], series_category_ids: [] });
  renderSrvs();
}
function catSummary(s, i) {
  const v = (s.vod_category_ids || []).length;
  const se = (s.series_category_ids || []).length;
  if (!v && !se) return '<div class="meta" id="catBox' + i + '">Pastas: todas (sem filtro)</div>';
  return '<div class="meta" id="catBox' + i + '">Filtro: ' + v + ' pasta(s) filme · ' + se + ' serie</div>';
}
function renderSrvs() {
  const box = document.getElementById('srvBox');
  box.innerHTML = _servers.map((s, i) => {
    const chips = EMOJIS.map((e) => '<button type="button" class="chip' + (s.color === e ? ' on' : '') + '" onclick="_servers[' + i + '].color=\'' + e + '\';renderSrvs()">' + e + '</button>').join('');
    return '<div class="srv">' +
      '<div class="row"><input style="flex:1" value="' + esc(s.name) + '" onchange="_servers[' + i + '].name=this.value;saveDraft()" placeholder="Nome"/>' +
      '<input style="width:70px" type="number" value="' + (s.priority || i + 1) + '" onchange="_servers[' + i + '].priority=+this.value;saveDraft()" title="Prioridade"/></div>' +
      '<div class="chips">' + chips + '</div>' +
      '<input value="' + esc(s.host) + '" onchange="_servers[' + i + '].host=this.value;saveDraft()" placeholder="http://host:porta"/>' +
      '<div class="row"><input style="flex:1" value="' + esc(s.user) + '" onchange="_servers[' + i + '].user=this.value;saveDraft()" placeholder="Usuario"/>' +
      '<input style="flex:1" type="password" value="' + esc(s.pass || '') + '" onchange="_servers[' + i + '].pass=this.value;saveDraft()" placeholder="Senha"/></div>' +
      '<div class="row" style="align-items:center;margin-top:6px">' +
      '<label class="chk"><input type="checkbox" ' + (s.enabled !== false ? 'checked' : '') + ' onchange="_servers[' + i + '].enabled=this.checked;saveDraft()"/> ON</label>' +
      '<label class="chk"><input type="checkbox" ' + (s.use_movies !== false ? 'checked' : '') + ' onchange="_servers[' + i + '].use_movies=this.checked;saveDraft()"/> Filmes</label>' +
      '<label class="chk"><input type="checkbox" ' + (s.use_series !== false ? 'checked' : '') + ' onchange="_servers[' + i + '].use_series=this.checked;saveDraft()"/> Series</label>' +
      '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="testSrv(' + i + ')">Testar</button>' +
      '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="loadCats(' + i + ')">Pastas</button>' +
      '<button class="btn-danger" style="padding:6px 10px;font-size:.75rem" onclick="_servers.splice(' + i + ',1);renderSrvs()">Remover</button>' +
      '</div>' + catSummary(s, i) + '</div>';
  }).join('');
  saveDraft();
}
async function loadCats(i) {
  const s = _servers[i];
  if (!s || !s.host || !s.user || !s.pass) { toast('Preencha host, user e senha'); return; }
  toast('Carregando pastas…');
  const d = await api('list-categories', { host: s.host, user: s.user, pass: s.pass });
  if (!d.ok) { toast(d.error || 'Falha pastas'); return; }
  const vod = d.vod || [];
  const series = d.series || [];
  const selV = new Set((s.vod_category_ids || []).map(String));
  const selS = new Set((s.series_category_ids || []).map(String));
  let h = '<div style="margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0a1020">';
  h += '<input id="catFilter' + i + '" placeholder="Filtrar pastas…" style="margin-bottom:8px" oninput="filterCatsUI(' + i + ')"/>';
  h += '<div class="row" style="margin-bottom:6px;align-items:center"><b style="font-size:.85rem">FILMES</b>';
  h += '<button class="btn-sec" style="padding:4px 8px;font-size:.7rem" type="button" onclick="toggleAllCats(' + i + ',\'vod\',true)">Todas</button>';
  h += '<button class="btn-sec" style="padding:4px 8px;font-size:.7rem" type="button" onclick="toggleAllCats(' + i + ',\'vod\',false)">Nenhuma</button></div>';
  h += '<div id="catVodList' + i + '" style="max-height:220px;overflow:auto;padding-right:4px">';
  if (!vod.length) h += '<div class="meta">Nenhuma categoria de filme</div>';
  vod.forEach(function(c) {
    const on = selV.has(String(c.id));
    const nm = esc(c.name);
    h += '<label class="chk cat-row" data-name="' + nm.toLowerCase() + '" style="display:flex;margin:4px 0;align-items:flex-start"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="toggleCat(' + i + ',\'vod\',\'' + String(c.id).replace(/'/g,'') + '\',this.checked)"/> <span>' + nm + ' <span class="meta">#' + esc(c.id) + '</span></span></label>';
  });
  h += '</div>';
  h += '<div class="row" style="margin:10px 0 6px;align-items:center"><b style="font-size:.85rem">SERIES</b>';
  h += '<button class="btn-sec" style="padding:4px 8px;font-size:.7rem" type="button" onclick="toggleAllCats(' + i + ',\'series\',true)">Todas</button>';
  h += '<button class="btn-sec" style="padding:4px 8px;font-size:.7rem" type="button" onclick="toggleAllCats(' + i + ',\'series\',false)">Nenhuma</button></div>';
  h += '<div id="catSerList' + i + '" style="max-height:180px;overflow:auto;padding-right:4px">';
  if (!series.length) h += '<div class="meta">Nenhuma categoria de serie</div>';
  series.forEach(function(c) {
    const on = selS.has(String(c.id));
    const nm = esc(c.name);
    h += '<label class="chk cat-row" data-name="' + nm.toLowerCase() + '" style="display:flex;margin:4px 0;align-items:flex-start"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="toggleCat(' + i + ',\'series\',\'' + String(c.id).replace(/'/g,'') + '\',this.checked)"/> <span>' + nm + ' <span class="meta">#' + esc(c.id) + '</span></span></label>';
  });
  h += '</div>';
  h += '<div class="row" style="margin-top:12px;gap:8px">';
  h += '<button type="button" class="btn-gold" style="flex:1;padding:10px" onclick="applyCats(' + i + ')">Salvar pastas deste servidor</button>';
  h += '<button type="button" class="btn-sec" style="padding:10px" onclick="closeCats(' + i + ')">Fechar</button>';
  h += '</div>';
  h += '<p class="hint" style="margin-top:8px">Marque o que quiser. Nenhuma = todas. Depois Salvar do pack.</p></div>';
  const box = document.getElementById('catBox' + i);
  if (box) box.outerHTML = '<div id="catBox' + i + '">' + h + '</div>';
  s._vodCats = vod;
  s._seriesCats = series;
  toast('Pastas carregadas');
}
function filterCatsUI(i) {
  const q = ((document.getElementById('catFilter' + i) || {}).value || '').toLowerCase().trim();
  ['catVodList' + i, 'catSerList' + i].forEach(function(id) {
    const root = document.getElementById(id);
    if (!root) return;
    root.querySelectorAll('.cat-row').forEach(function(el) {
      const n = el.getAttribute('data-name') || '';
      el.style.display = (!q || n.indexOf(q) >= 0) ? 'flex' : 'none';
    });
  });
}
function applyCats(i) {
  const s = _servers[i];
  if (!s) return;
  saveDraft();
  const box = document.getElementById('catBox' + i);
  if (box) box.outerHTML = catSummary(s, i);
  toast('Pastas do servidor ' + (i + 1) + ' no formulario. Clique Salvar do pack.');
}
function closeCats(i) {
  const s = _servers[i];
  if (!s) return;
  const box = document.getElementById('catBox' + i);
  if (box) box.outerHTML = catSummary(s, i);
}
function toggleCat(i, kind, id, on) {
  const s = _servers[i];
  if (!s) return;
  const key = kind === 'vod' ? 'vod_category_ids' : 'series_category_ids';
  if (!Array.isArray(s[key])) s[key] = [];
  const set = new Set(s[key].map(String));
  if (on) set.add(String(id)); else set.delete(String(id));
  s[key] = Array.from(set);
  saveDraft();
}
function toggleAllCats(i, kind, all) {
  const s = _servers[i];
  if (!s) return;
  const key = kind === 'vod' ? 'vod_category_ids' : 'series_category_ids';
  const list = kind === 'vod' ? (s._vodCats || []) : (s._seriesCats || []);
  s[key] = all ? list.map(function(c) { return String(c.id); }) : [];
  saveDraft();
  loadCats(i);
}
async function testSrv(i) {
  const s = _servers[i];
  if (!s || !s.host || !s.user || !s.pass) { toast('Preencha host, user e senha'); return; }
  toast('Testando…');
  const d = await api('test-server', { host: s.host, user: s.user, pass: s.pass });
  if (d.ok) toast('OK: ' + d.vodCount + ' filmes');
  else toast(d.error || 'Falha');
}
async function save() {
  saveDraft();
  const missing = _servers.filter((s) => !s.host || !s.user || !s.pass);
  if (missing.length) { toast('Algum servidor sem host, usuario ou senha'); return; }
  if (!_servers.length) { toast('Adicione pelo menos 1 servidor'); return; }
  toast('Salvando…');
  const d = await api('save', {
    id: _editId || undefined,
    name: document.getElementById('pName').value.trim() || 'FlixHub',
    servers: _servers,
    public_enabled: !!document.getElementById('pPublic').checked,
  });
  if (d.error) { toast(typeof d.error === 'string' ? d.error : (d.hint || JSON.stringify(d.error))); return; }
  clearDraft();
  toast(_editId ? 'Salvo' : 'Pack criado');
  if (d.manifest_url) { try { await navigator.clipboard.writeText(d.manifest_url); } catch (_) {} }
  if (d.public_url) { try { await navigator.clipboard.writeText(d.public_url); } catch (_) {} }
  _editId = null;
  document.getElementById('formTitle').textContent = 'Novo pack';
  document.getElementById('btnSave').textContent = 'Salvar e gerar';
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('pPublic').checked = false;
  _servers = [];
  renderSrvs();
  loadList();
}
function editPack(id) {
  const p = (_packs || []).find((x) => x.id === id);
  if (!p) return;
  _editId = id;
  document.getElementById('pName').value = p.name || 'FlixHub';
  document.getElementById('pPublic').checked = !!p.public_enabled;
  document.getElementById('formTitle').textContent = 'Editar pack';
  document.getElementById('btnSave').textContent = 'Salvar alteracoes';
  document.getElementById('btnCancel').style.display = 'inline-block';
  _servers = (p.servers || []).map((s) => Object.assign({}, s, {
    pass: s.pass || '',
    vod_category_ids: s.vod_category_ids || [],
    series_category_ids: s.series_category_ids || [],
  }));
  renderSrvs();
  window.scrollTo(0, 0);
}
function cancelEdit() {
  _editId = null;
  clearDraft();
  document.getElementById('formTitle').textContent = 'Novo pack';
  document.getElementById('btnSave').textContent = 'Salvar e gerar';
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('pName').value = 'FlixHub';
  document.getElementById('pPublic').checked = false;
  _servers = [];
  renderSrvs();
}
async function loadList() {
  const wrap = document.getElementById('list');
  try {
    const d = await api('list');
    if (d.error) {
      wrap.innerHTML = '<p style="color:var(--red)">' + esc(d.error.message || d.error) + '</p>';
      return;
    }
    _packs = d.packs || [];
    if (!_packs.length) { wrap.innerHTML = '<p class="hint">Nenhum pack ainda.</p>'; return; }
    wrap.innerHTML = _packs.map((p) => {
      const url = p.manifest_url || '';
      const pub = p.public_url || '';
      const srvs = (p.servers || []).map((s) => (s.color || '') + ' ' + (s.name || '') + (s.enabled === false ? ' OFF' : '')).join(' · ');
      return '<div class="item"><b>' + esc(p.name) + '</b> ' +
        (p.is_active ? '<span style="color:var(--green)">ativo</span>' : '<span style="color:var(--muted)">off</span>') +
        (p.public_enabled ? ' <span style="color:#7dd3fc">publico</span>' : '') +
        '<div class="meta">' + esc(srvs) + '</div>' +
        '<div class="meta"><b>Privado:</b> ' + esc(url) + '</div>' +
        (pub ? '<div class="meta"><b>Publico:</b> ' + esc(pub) + '</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">' +
        '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="navigator.clipboard.writeText(\'' + url.replace(/'/g, '') + '\');toast(\'Privado copiado\')">Copiar privado</button>' +
        (pub ? '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="navigator.clipboard.writeText(\'' + pub.replace(/'/g, '') + '\');toast(\'Publico copiado\')">Copiar publico</button>' : '') +
        '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="editPack(\'' + p.id + '\')">Editar</button>' +
        '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="api(\'set-public\',{id:\'' + p.id + '\',enabled:' + (!p.public_enabled) + '}).then(function(r){toast(r.error?(r.hint||r.error):(r.public_url?\'Publico ON\':\'Publico OFF\'));loadList()})">' + (p.public_enabled ? 'Desligar publico' : 'Ligar publico') + '</button>' +
        '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="api(\'rotate-token\',{id:\'' + p.id + '\'}).then(function(r){toast(r.error?r.error:\'Token novo\');loadList()})">Novo token</button>' +
        '<button class="btn-sec" style="padding:6px 10px;font-size:.75rem" onclick="api(\'toggle\',{id:\'' + p.id + '\',is_active:' + (!p.is_active) + '}).then(loadList)">' + (p.is_active ? 'Pausar' : 'Ativar') + '</button>' +
        '<button class="btn-danger" style="padding:6px 10px;font-size:.75rem" onclick="if(confirm(\'Excluir pack?\'))api(\'delete\',{id:\'' + p.id + '\'}).then(loadList)">Excluir</button>' +
        '</div></div>';
    }).join('');
  } catch (e) {
    wrap.innerHTML = '<p style="color:var(--red)">Erro: ' + esc(String(e)) + '</p>';
  }
}
async function checkSession() {
  try {
    const { data } = await sb.auth.getSession();
    _session = data.session;
    if (!_session) { location.href = '/admin.html'; return; }
    if (!loadDraft()) renderSrvs();
    await loadList();
  } catch (e) {
    document.getElementById('list').innerHTML = '<p style="color:var(--red)">Erro sessao: ' + esc(String(e)) + '</p>';
  }
}
checkSession();
  </script>
