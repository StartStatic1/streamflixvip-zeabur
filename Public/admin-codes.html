<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>if(location.hostname==="streamflixvip.online")location.replace("https://www.streamflixvip.online"+location.pathname+location.search+location.hash);</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Códigos VIP — StreamFlixVIP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07070c;--card:#12121c;--line:#2a2a3a;--gold:#f5c518;--text:#f3f3f8;--muted:#9aa0b4;--red:#e05252;--green:#2ecc71;--orange:#f0a040}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 400px at 10% -10%,#3a2a00 0%,transparent 50%),var(--bg);color:var(--text);min-height:100vh;padding:16px 12px 60px}
.wrap{max-width:1000px;margin:0 auto}a{color:var(--gold)}
.brand{font-weight:800;font-size:20px}.brand span{color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:linear-gradient(180deg,#171724,var(--card));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{width:100%;background:#0d0d15;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:15px}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button,.btn{background:#22223a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}.danger{background:#3a1515;border-color:#6a2525;color:#ffb0b0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{white-space:nowrap;border-radius:999px;padding:7px 12px;font-size:13px;background:#191928;border:1px solid var(--line);cursor:pointer}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#0f0f18;cursor:pointer}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.5px}
.muted{color:var(--muted);font-size:13px}
.badge{font-size:11px;border-radius:999px;padding:3px 8px;border:1px solid var(--line);white-space:nowrap}
.s-ativo{color:var(--green)}.s-vencendo{color:var(--orange)}.s-vencido,.s-desativado{color:var(--red)}.s-nao_vendido{color:var(--muted)}.s-vendido_sem_uso{color:var(--gold)}
#login{max-width:380px;margin:60px auto}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.open{display:flex}.sheet{background:#12121c;border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none;z-index:10}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Stream<span>Flix</span>VIP · Códigos</div><div><a href="/admin-hub.html">← Painéis</a></div></div>

  <div id="login" class="card" style="display:none">
    <h2>Entrar no painel</h2>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:12px"><button class="gold" onclick="doLogin()">Entrar</button></div>
    <div id="lmsg" class="muted" style="margin-top:8px"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h2>✨ Gerar códigos</h2>
      <div class="row">
        <div><label>Plano</label><select id="gPlan"></select></div>
        <div><label>Quantidade</label><input id="gQty" type="number" min="1" max="200" value="1"></div>
        <div><label>Prefixo (opcional)</label><input id="gPrefix" placeholder="VIP"></div>
        <div><label>Lote (ex.: Revenda João · Nov)</label><input id="gBatch"></div>
      </div>
      <div class="row">
        <div><label>Comprador (opcional)</label><input id="gName"></div>
        <div><label>WhatsApp (opcional)</label><input id="gPhone" inputmode="tel" placeholder="5584999999999"></div>
      </div>
      <label>Nota (opcional)</label><input id="gNote">
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="gold" id="gBtn" onclick="gerar()">Gerar</button></div>
      <div id="gOut" style="display:none;margin-top:10px"><textarea id="gCodes" rows="4" readonly></textarea>
        <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="copyText(document.getElementById('gCodes').value)">Copiar</button><a class="btn" id="gWa" target="_blank" rel="noopener">Enviar no WhatsApp</a></div></div>
    </div>

    <div class="card" id="remCard">
      <h2>🔔 Renovações (vencem em 7 dias ou venceram há pouco)</h2>
      <div id="rem" class="muted">Carregando…</div>
    </div>

    <div class="card">
      <h2>🎟️ Códigos</h2>
      <input id="q" placeholder="Buscar código, e-mail, comprador, WhatsApp, lote…" oninput="render()">
      <div class="chips" id="chips"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0">
        <span id="count" class="muted"></span>
        <span><select id="batchSel" onchange="render()" style="width:auto;padding:7px"></select> <button onclick="exportCsv()">⬇️ CSV</button> <button onclick="load()">↻</button></span>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="sheet" id="ms"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://gkujbjpvphuvrejpvvtz.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdWpianB2cGh1dnJlanB2dnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTQ2OTMsImV4cCI6MjA5NDI3MDY5M30.Zoqdn0V6SZOAfhz9kK9NgG6lniJdyVqihLsNT-O8Huw';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sfv-admin-auth-token',storage:window.localStorage}});
let S=null, CODES=[], PLANS=[], F='todos';
const ST={todos:'Todos',nao_vendido:'Não vendido',vendido_sem_uso:'Vendido sem uso',ativo:'Ativo',vencendo:'Vencendo em 7 dias',vencido:'Vencido',desativado:'Desativado'};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
const fmtDT=d=>d?new Date(d).toLocaleString('pt-BR'):'—';
const money=v=>v==null?'—':'R$'+v.toFixed(2).replace('.',',');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado'),()=>toast('Não deu pra copiar'))}
db.auth.onAuthStateChange((ev,s)=>{if(s)S=s});
async function tok(force){try{const r=force?await db.auth.refreshSession():await db.auth.getSession();if(r?.data?.session)S=r.data.session}catch(_){}return S?.access_token}
async function api(action,extra={}){
  const call=async t=>fetch('/api/admin-vip',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({action,...extra})});
  let r=await call(await tok(false)); if(r.status===401) r=await call(await tok(true));
  if(r.status===401||r.status===403){showLogin(r.status===403?'Esta conta não é admin.':'Entre de novo.');return {error:'auth'}}
  try{return await r.json()}catch(_){return {error:'Resposta inválida'}}
}
function showLogin(msg){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';document.getElementById('lmsg').textContent=msg||''}
async function doLogin(){const {error}=await db.auth.signInWithPassword({email:document.getElementById('em').value.trim().toLowerCase(),password:document.getElementById('pw').value});if(error){document.getElementById('lmsg').textContent='❌ '+error.message;return}start()}
async function start(){await tok(false);if(!S){showLogin();return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)tok(false)});

async function load(){
  const d=await api('codes-panel'); if(d.error){if(d.error!=='auth')toast('❌ '+d.error);return}
  CODES=d.codes||[]; PLANS=d.plans||[];
  document.getElementById('gPlan').innerHTML=PLANS.map(p=>`<option value="${p.id}">${esc(p.label)}${p.price?' — '+money(p.price):''}</option>`).join('');
  const batches=[...new Set(CODES.map(c=>c.batch).filter(Boolean))].sort();
  const bs=document.getElementById('batchSel'), cur=bs.value;
  bs.innerHTML='<option value="">Todos os lotes</option>'+batches.map(b=>`<option ${b===cur?'selected':''}>${esc(b)}</option>`).join('');
  render(); renderRem();
}
function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase(), b=document.getElementById('batchSel').value;
  return CODES.filter(c=>(F==='todos'||c.status===F)&&(!b||c.batch===b)&&(!q||[c.code,c.account?.email,c.account?.name,c.buyerName,c.buyerPhone,c.batch,c.note].some(v=>v&&String(v).toLowerCase().includes(q))));
}
function render(){
  const cnt={};CODES.forEach(c=>cnt[c.status]=(cnt[c.status]||0)+1);
  document.getElementById('chips').innerHTML=Object.keys(ST).map(k=>`<span class="chip ${F===k?'on':''}" onclick="F='${k}';render()">${ST[k]} ${k==='todos'?CODES.length:(cnt[k]||0)}</span>`).join('');
  const list=filtered(); document.getElementById('count').textContent=list.length+' código(s)';
  document.getElementById('list').innerHTML=list.slice(0,400).map(c=>`<div class="item" onclick="openCode('${esc(c.code)}')">
    <div class="l1"><span class="code">${esc(c.code)}</span><span class="badge s-${c.status}">${ST[c.status]}</span></div>
    <div class="muted">${esc(c.planLabel||'')} · ${money(c.price)}${c.batch?' · 📦 '+esc(c.batch):''}${c.expiresAt?' · vence '+fmtD(c.expiresAt):''}</div>
    <div class="muted">${c.buyerName||c.buyerPhone?'🧾 '+esc(c.buyerName||'')+' '+esc(c.buyerPhone||''):''}${c.account?.email?' · 👤 '+esc(c.account.email):''}${c.tvCount?' · 📺 '+c.tvCount:''}</div>
  </div>`).join('')+(list.length>400?'<div class="muted">Mostrando 400. Use a busca ou o CSV.</div>':'');
}
function waLink(phone,text){const p=String(phone||'').replace(/\D/g,'');return 'https://wa.me/'+(p?p:'')+'?text='+encodeURIComponent(text)}
function renewMsg(c){const pl=PLANS.filter(p=>p.price>0).map(p=>`${p.label} ${money(p.price)}`).join(' · ');
  const venc=c.expiresAt&&new Date(c.expiresAt)<new Date()?'venceu em '+fmtD(c.expiresAt):'vence em '+fmtD(c.expiresAt);
  return `Olá${c.buyerName?' '+c.buyerName:''}! Seu VIP do StreamFlix (${c.planLabel||'plano'}) ${venc}. Quer renovar? ${pl}`}
function renderRem(){
  const now=Date.now(), list=CODES.filter(c=>c.isActive&&c.expiresAt&&(c.status==='vencendo'||(c.status==='vencido'&&now-new Date(c.expiresAt)<7*864e5))).sort((a,b)=>new Date(a.expiresAt)-new Date(b.expiresAt));
  document.getElementById('rem').innerHTML=list.length?list.map(c=>`<div class="item" style="cursor:default"><div class="l1"><span><span class="code">${esc(c.code)}</span> <span class="muted">${esc(c.buyerName||c.account?.email||'')}</span></span><span class="badge s-${c.status}">${fmtD(c.expiresAt)}</span></div>
    <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><a class="btn gold" target="_blank" rel="noopener" href="${waLink(c.buyerPhone,renewMsg(c))}">💬 ${c.buyerPhone?'WhatsApp':'WhatsApp (escolher contato)'}</a><button onclick="openCode('${esc(c.code)}')">Detalhes</button></div></div>`).join(''):'Nenhuma renovação pendente 🎉';
}
async function gerar(){
  const b=document.getElementById('gBtn');b.disabled=true;b.textContent='Gerando…';
  const r=await api('create-batch',{planId:gPlan.value,qty:gQty.value,prefix:gPrefix.value,batch:gBatch.value,buyerName:gName.value,buyerPhone:gPhone.value,note:gNote.value});
  b.disabled=false;b.textContent='Gerar';
  if(r.error){if(r.error!=='auth')toast('❌ '+r.error);return}
  gCodes.value=r.created.join('\n');gOut.style.display='block';
  gWa.href=waLink(gPhone.value,`Seu código VIP StreamFlix (${r.planLabel}):\n${r.created.join('\n')}\n\nNo app: Perfil > VIP > Resgatar código. Na TV: digite o código na tela de ativação.`);
  toast('✅ '+r.created.length+' código(s) criado(s)');load();
}
function closeM(){document.getElementById('m').classList.remove('open')}
async function openCode(code){
  const ms=document.getElementById('ms');ms.innerHTML='<div class="muted">Carregando…</div>';document.getElementById('m').classList.add('open');
  const d=await api('code-detail',{code}); if(d.error){ms.innerHTML='<div class="muted">'+esc(d.error)+'</div>';return}
  const c=d.code, dv=d.devices||{};
  const dev=(i,x)=>x?`${i} ${esc(x.label||'aparelho')} …${esc(x.deviceIdTail)} <span class="muted">(visto ${fmtDT(x.lastSeen)})</span>`:`${i} —`;
  ms.innerHTML=`<div class="l1" style="display:flex;justify-content:space-between;align-items:center"><span class="code" style="font-size:18px">${esc(c.code)}</span><button onclick="closeM()">✕</button></div>
  <div style="margin:8px 0"><span class="badge s-${c.status}">${ST[c.status]}</span></div>
  <div class="kv"><div>Plano</div><div>${esc(c.planLabel||'')} · ${money(c.price)}</div><div>Criado</div><div>${fmtDT(c.createdAt)}</div>
  <div>Lote</div><div>${esc(c.batch||'—')}</div><div>Conta</div><div>${esc(c.account?.email||'—')}${c.account?.name?' ('+esc(c.account.name)+')':''}</div>
  <div>Resgatado</div><div>${fmtDT(c.usedAt)}</div><div>Vence</div><div>${fmtDT(c.expiresAt)}</div>
  <div>Celular</div><div>${dev('📱',dv.phone)}</div><div>TV em uso</div><div>${dev('📺',dv.tv)}</div>
  <div>TVs ativadas</div><div>${(d.tvs||[]).filter(t=>t.active).map(t=>esc(t.label||'TV')+' …'+esc(t.deviceIdTail)).join(', ')||'—'}</div>
  ${dv.swaps_phone||dv.swaps_tv||dv.blocked_phone||dv.blocked_tv?`<div>Trocas/bloqueios</div><div>📱 ${dv.swaps_phone||0}/${dv.blocked_phone||0} · 📺 ${dv.swaps_tv||0}/${dv.blocked_tv||0}</div>`:''}</div>
  <h2 style="margin-top:14px">Comprador</h2>
  <div class="row"><div><label>Nome</label><input id="eName" value="${esc(c.buyerName)}"></div><div><label>WhatsApp</label><input id="ePhone" inputmode="tel" value="${esc(c.buyerPhone)}"></div></div>
  <div class="row"><div><label>Lote</label><input id="eBatch" value="${esc(c.batch)}"></div><div><label>Vendido?</label><select id="eSold"><option value="1" ${c.soldAt?'selected':''}>Sim${c.soldAt?' ('+fmtD(c.soldAt)+')':''}</option><option value="0" ${c.soldAt?'':'selected'}>Não</option></select></div></div>
  <label>Nota</label><textarea id="eNote" rows="2">${esc(c.note)}</textarea>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="gold" onclick="saveMeta('${esc(c.code)}')">Salvar</button>
    <button onclick="copyText('${esc(c.code)}')">Copiar código</button>
    ${c.expiresAt?`<a class="btn" target="_blank" rel="noopener" href="${waLink(c.buyerPhone,renewMsg(c))}">💬 Lembrar renovação</a>`:''}
    ${(dv.phone||dv.tv)?`<button onclick="releaseDev('${esc(d.deviceKey)}','${esc(c.code)}')">Liberar aparelhos</button>`:''}
    ${c.isActive?`<button class="danger" onclick="deact('${esc(c.code)}',${!!c.account})">Desativar e liberar aparelhos</button>`:`<button onclick="react('${esc(c.code)}')">Reativar código</button>`}
  </div>
  <h2 style="margin-top:14px">Histórico</h2>
  <div class="muted">${[...(d.redemptions||[]).map(r=>({at:r.redeemed_at,what:`resgatado no ${r.platform==='tv'?'📺 TV':'📱 celular'}${r.email?' por '+r.email:''}${r.device_id?' (…'+r.device_id+')':''}`})),...(d.history||[])].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(h=>`${fmtDT(h.at)} — ${esc(h.what)}`).join('<br>')||'—'}</div>`;
}
async function saveMeta(code){const r=await api('code-meta-save',{code,buyerName:eName.value,buyerPhone:ePhone.value,batch:eBatch.value,note:eNote.value,sold:eSold.value==='1'});if(r.ok){toast('✅ Salvo');await load();openCode(code)}else if(r.error!=='auth')toast('❌ '+r.error)}
async function releaseDev(key,code){if(!confirm('Liberar celular e TV? O próximo aparelho que abrir o app vira o ativo e as trocas do mês são zeradas.'))return;const r=await api('device-release',{key});if(r.ok){toast('✅ Liberado');openCode(code)}}
async function deact(code,hasAcc){
  if(!confirm('Desativar o código '+code+'? As TVs dele são desligadas e os aparelhos liberados.'))return;
  const end=hasAcc&&confirm('Também ENCERRAR AGORA o VIP da conta que usou este código? (reembolso/abuso)\n\nOK = encerrar VIP · Cancelar = só desativar o código');
  const r=await api('deactivate-release',{code,endAccountVip:end});if(r.ok){toast('✅ Desativado'+(r.endedVip?' e VIP encerrado':''));await load();openCode(code)}else if(r.error!=='auth')toast('❌ '+r.error)}
async function react(code){const r=await api('reactivate',{code});if(!r.error){toast('✅ Código reativado (TVs precisam ativar de novo)');await load();openCode(code)}}
function exportCsv(){
  const cols=['code','status','planLabel','price','batch','buyerName','buyerPhone','note','soldAt','createdAt','usedAt','expiresAt','email','tvCount'];
  const rows=filtered().map(c=>cols.map(k=>{let v=k==='email'?(c.account?.email||''):c[k];if(k==='status')v=ST[v];if(k==='soldAt'&&v)v=new Date(v).toISOString();return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(';'));
  const blob=new Blob(['\ufeff'+cols.join(';')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='codigos-vip-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
start();
</script>
</body>
</html>
