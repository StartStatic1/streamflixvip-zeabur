<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>API Parceiro</title>
<style>
body{font-family:system-ui;background:#0b0f14;color:#e8eef7;padding:16px;margin:0}
.card{background:#141a22;border:1px solid #243041;border-radius:12px;padding:14px;margin:12px 0}
input,select{width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid #243041;background:#0d1218;color:#fff;box-sizing:border-box}
button{background:#00e5ff;color:#041018;border:0;border-radius:8px;padding:10px 14px;font-weight:700;margin:4px 4px 4px 0}
pre{background:#0a0e13;padding:12px;border-radius:10px;overflow:auto;max-height:50vh;font-size:12px;white-space:pre-wrap}
.ok{color:#3dd68c}.err{color:#ff6b6b}
</style></head><body>
<h2>StreamFlixVIP · API Parceiro</h2>
<div class="card">
<label>Base</label><input id="base" value="https://www.streamflixvip.online"/>
<label>Token</label><input id="token" placeholder="sf_live_..."/>
<label>TMDB</label><input id="tmdb" value="550"/>
<label>Tipo</label><select id="type"><option value="movie">movie</option><option value="tv">tv</option></select>
<button onclick="go('ping')">Ping</button>
<button onclick="go('catalog')">Catalog</button>
<button onclick="go('sources')">Sources</button>
<p id="st">Pronto</p>
</div>
<pre id="out">{}</pre>
<script>
async function go(a){
  const b=document.getElementById('base').value.replace(/\/$/,''),
        t=document.getElementById('token').value.trim(),
        st=document.getElementById('st');
  if(!t){st.textContent='Cole o token';st.className='err';return}
  let p='/api/partner?action='+a;
  if(a==='catalog') p+='&type=movie&limit=20';
  if(a==='sources') p+='&tmdb_id='+encodeURIComponent(document.getElementById('tmdb').value)+'&type='+document.getElementById('type').value;
  st.textContent='Chamando...';st.className='';
  try{
    const r=await fetch(b+p,{headers:{Authorization:'Bearer '+t,Accept:'application/json'}});
    const x=await r.text();
    let j;try{j=JSON.parse(x)}catch{j=x}
    document.getElementById('out').textContent=typeof j==='string'?j:JSON.stringify(j,null,2);
    st.textContent='HTTP '+r.status;st.className=r.ok?'ok':'err';
  }catch(e){st.textContent=e.message;st.className='err'}
}
</script>
</body></html>
