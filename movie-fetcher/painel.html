<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Fetcher - Candidatos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0b0e14;
    color: #e6e6e6;
  }
  header {
    padding: 20px;
    background: #12161f;
    border-bottom: 1px solid #232838;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0 0 12px 0; font-size: 1.3rem; }
  #status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  #status-bar.online { background: #1f3a24; color: #6fd97f; }
  #status-bar.offline { background: #3a1f24; color: #ff8080; }
  #status-bar.idle { background: #1a2438; color: #7fb0e0; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  #status-dot.pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #status-progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    overflow: hidden;
    min-width: 60px;
  }
  #status-progress-fill {
    height: 100%;
    background: currentColor;
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #2a3040;
    background: #1a1f2b;
    color: #fff;
    font-size: 1rem;
  }
  #stats { color: #8b93a7; font-size: 0.85rem; margin-top: 8px; }
  #filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid #2a3040;
    background: #1a1f2b;
    color: #8b93a7;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .filter-btn.active { background: #2d5cf2; color: #fff; border-color: #2d5cf2; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    padding: 16px;
  }
  .card {
    background: #151a24;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #232838;
  }
  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: #1a1f2b;
    display: block;
  }
  .card .info { padding: 8px; }
  .card .title { font-size: 0.85rem; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
  .card .year { font-size: 0.75rem; color: #8b93a7; }
  .card .badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.pending { background: #3a3220; color: #e0c05c; }
  .badge.done { background: #1f3a24; color: #6fd97f; }
  .badge.downloading { background: #1f2f3a; color: #6fb8d9; }
  .badge.queued { background: #2a2540; color: #b39ddb; }
  .badge.error { background: #3a1f24; color: #ff8080; }
  .card .error-msg {
    font-size: 0.65rem;
    color: #ff8080;
    padding: 0 8px;
    margin-top: 4px;
    line-height: 1.3;
    max-height: 2.6em;
    overflow: hidden;
  }
  .card .link-box { padding: 8px; display: flex; gap: 6px; }
  .card .link-box input {
    flex: 1;
    min-width: 0;
    font-size: 0.7rem;
    padding: 6px;
    background: #0b0e14;
    border: 1px solid #232838;
    color: #8b93a7;
    border-radius: 4px;
  }
  .copy-btn {
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid #2a3040;
    background: #1a1f2b;
    color: #6fd97f;
    font-size: 0.7rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .copy-btn.copied { background: #1f3a24; color: #6fd97f; border-color: #2d5cf2; }
  #empty { text-align: center; padding: 40px; color: #8b93a7; }
  .dl-btn {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: none;
    background: #2d5cf2;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }
  .dl-btn.retry { background: #a33; }
  .dl-btn:disabled { background: #3a3f4d; cursor: default; }
  #pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 16px;
    color: #8b93a7;
    font-size: 0.85rem;
  }
  #pager button {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #2a3040;
    background: #1a1f2b;
    color: #fff;
    cursor: pointer;
  }
  #pager button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Movie Fetcher - Candidatos (1975-1995)</h1>
  <div id="status-bar" class="idle">
    <span id="status-dot"></span>
    <span id="status-text">Verificando status...</span>
  </div>
  <input id="search" type="text" placeholder="Buscar por titulo...">
  <div id="stats">Carregando...</div>
  <div id="filters">
    <button class="filter-btn active" data-status="all">Todos</button>
    <button class="filter-btn" data-status="pending">Pendentes</button>
    <button class="filter-btn" data-status="queued">Na fila</button>
    <button class="filter-btn" data-status="downloading">Baixando</button>
    <button class="filter-btn" data-status="done">Prontos</button>
    <button class="filter-btn" data-status="error">Com erro</button>
  </div>
</header>

<div id="grid"></div>
<div id="empty" style="display:none">Nenhum filme encontrado.</div>
<div id="pager"></div>

<script>
const R2_PUBLIC_BASE_URL = "https://pub-90cce3ad488f4a52ac089b9496083787.r2.dev";
const CANDIDATES_URL = R2_PUBLIC_BASE_URL + "/movie-fetcher/candidates.json";
const STATUS_URL = R2_PUBLIC_BASE_URL + "/movie-fetcher/downloader_status.json";
const REQUEST_API_URL = "http://65.21.48.50:8091/api/request-download";
const PAGE_SIZE = 60;
const STALE_SECONDS = 180; // se o status nao atualizar em 3min, considera offline

let allMovies = [];
let currentFilter = "all";
let currentPage = 1;

function formatBytes(bytes) {
  if (!bytes) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  let n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + " " + units[i];
}

async function loadStatus() {
  const bar = document.getElementById("status-bar");
  const dot = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("sem status ainda");
    const s = await res.json();

    const updatedAt = new Date(s.updated_at);
    const ageSec = (Date.now() - updatedAt.getTime()) / 1000;

    if (ageSec > STALE_SECONDS) {
      bar.className = "offline";
      dot.className = "";
      text.textContent = "Downloader parado (sem atividade ha " + Math.round(ageSec / 60) + " min) - abra o Termux no celular";
      return;
    }

    if (s.state === "downloading") {
      bar.className = "online";
      dot.className = "pulse";
      const movie = allMovies.find(function(m) { return m.id === s.current_movie; });
      const title = movie ? movie.title : s.current_movie;
      let progressHtml = "";
      if (s.progress_pct !== undefined) {
        progressHtml =
          '<div id="status-progress-bar"><div id="status-progress-fill" style="width:' + s.progress_pct + '%"></div></div>' +
          '<span>' + s.progress_pct + '%</span>';
      }
      text.innerHTML = 'Baixando: ' + escapeHtml(title || "...") +
        (s.speed_bytes_s ? ' - ' + formatBytes(s.speed_bytes_s) + '/s' : '');
      if (progressHtml) {
        bar.innerHTML = '<span id="status-dot" class="pulse"></span><span style="white-space:nowrap">Baixando: ' +
          escapeHtml(title || "...") + '</span>' + progressHtml;
      }
    } else if (s.state === "running_idle") {
      bar.className = "online";
      dot.className = "";
      text.textContent = "Downloader ativo, aguardando fila" +
        (s.session_processed ? " (" + s.session_processed + " processados nesta sessao)" : "");
    } else {
      bar.className = "offline";
      dot.className = "";
      text.textContent = "Downloader parado";
    }
  } catch (err) {
    bar.className = "offline";
    dot.className = "";
    text.textContent = "Downloader offline ou nunca iniciado";
  }
}

async function requestDownload(id, btn) {
  btn.disabled = true;
  btn.textContent = "Enviando...";
  try {
    const res = await fetch(REQUEST_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (res.ok) {
      btn.textContent = "Na fila!";
      setTimeout(loadCandidates, 1500);
    } else {
      btn.textContent = "Erro: " + (data.error || "falhou");
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = "Erro de conexao";
    btn.disabled = false;
  }
}

function copyLink(url, btn) {
  navigator.clipboard.writeText(url).then(function() {
    const original = btn.textContent;
    btn.textContent = "Copiado!";
    btn.classList.add("copied");
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1500);
  }).catch(function() {
    btn.textContent = "Falhou";
  });
}

async function loadCandidates() {
  try {
    const res = await fetch(CANDIDATES_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    allMovies = await res.json();
    allMovies.sort(function(a, b) { return b.year.localeCompare(a.year); });
    applyFilters();
  } catch (err) {
    document.getElementById("stats").textContent = "Erro ao carregar: " + err.message;
  }
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let filtered = allMovies;

  if (currentFilter !== "all") {
    filtered = filtered.filter(function(m) { return (m.status || "pending") === currentFilter; });
  }
  if (q) {
    filtered = filtered.filter(function(m) { return m.title.toLowerCase().includes(q); });
  }

  currentPage = Math.min(currentPage, Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)));
  render(filtered);
}

function render(movies) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const stats = document.getElementById("stats");
  const pager = document.getElementById("pager");

  stats.textContent = movies.length + " filme(s) encontrado(s)";

  if (movies.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    pager.innerHTML = "";
    return;
  }
  empty.style.display = "none";

  const totalPages = Math.max(1, Math.ceil(movies.length / PAGE_SIZE));
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = movies.slice(start, start + PAGE_SIZE);

  grid.innerHTML = pageItems.map(function(m) {
    const poster = m.poster_url || "";
    const status = m.status || "pending";
    const statusMap = {
      done: ["done", "Pronto"],
      downloading: ["downloading", "Baixando"],
      queued: ["queued", "Na fila"],
      error: ["error", "Erro"],
      pending: ["pending", "Pendente"]
    };
    const pair = statusMap[status] || statusMap.pending;
    const statusClass = pair[0];
    const statusLabel = pair[1];

    const errorMsg = (status === "error" && m.error)
      ? '<div class="error-msg" title="' + escapeAttr(m.error) + '">' + escapeHtml(m.error) + '</div>'
      : "";

    const linkBox = (status === "done" && m.r2_url)
      ? '<div class="link-box">' +
          '<input readonly value="' + m.r2_url + '" onclick="this.select()">' +
          '<button class="copy-btn" onclick="copyLink(\'' + m.r2_url + '\', this)">Copiar</button>' +
        '</div>'
      : "";

    // Botao aparece tanto para pendentes (baixar) quanto para erro (tentar de novo)
    let downloadBtn = "";
    if (status === "pending") {
      downloadBtn = '<button class="dl-btn" onclick="requestDownload(\'' + m.id + '\', this)">Baixar este filme</button>';
    } else if (status === "error") {
      downloadBtn = '<button class="dl-btn retry" onclick="requestDownload(\'' + m.id + '\', this)">Tentar novamente</button>';
    }

    return (
      '<div class="card">' +
        '<img src="' + poster + '" loading="lazy" alt="' + escapeAttr(m.title) + '" onerror="this.style.opacity=0.2">' +
        '<div class="info">' +
          '<div class="title">' + escapeHtml(m.title) + '</div>' +
          '<div class="year">' + m.year + ' - ' + (m.source_group || "") + '</div>' +
          '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' +
        '</div>' +
        errorMsg +
        linkBox +
        (downloadBtn ? '<div style="padding:0 8px 8px">' + downloadBtn + '</div>' : '') +
      '</div>'
    );
  }).join("");

  pager.innerHTML =
    '<button id="prevPage" ' + (currentPage <= 1 ? 'disabled' : '') + '>&larr; Anterior</button>' +
    '<span>Pagina ' + currentPage + ' de ' + totalPages + '</span>' +
    '<button id="nextPage" ' + (currentPage >= totalPages ? 'disabled' : '') + '>Proxima &rarr;</button>';

  const prevBtn = document.getElementById("prevPage");
  const nextBtn = document.getElementById("nextPage");
  if (prevBtn) prevBtn.onclick = function() { currentPage--; applyFilters(); window.scrollTo(0, 0); };
  if (nextBtn) nextBtn.onclick = function() { currentPage++; applyFilters(); window.scrollTo(0, 0); };
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}
function escapeAttr(str) {
  return (str || "").replace(/"/g, "&quot;");
}

document.getElementById("search").addEventListener("input", function() {
  currentPage = 1;
  applyFilters();
});

document.querySelectorAll(".filter-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentFilter = btn.dataset.status;
    currentPage = 1;
    applyFilters();
  });
});

loadCandidates();
loadStatus();
setInterval(loadCandidates, 30000);
setInterval(loadStatus, 8000);
</script>

</body>
</html>
