name: Sincronização Xtream API (standalone)

# Irmão do "Sincronização IPTV (standalone)" (iptv-sync.yml), mas pra
# fontes cadastradas como API Xtream (player_api.php) em vez de M3U.
# Roda separado de propósito: usa seus próprios cursores no banco
# (xtream_sync_cursor / xtream_series_sync_cursor), então não disputa
# progresso nem tempo com a sincronização M3U.
#
# IMPORTANTE — antes de usar, configure os Secrets do repositório em:
# Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_SERVICE_ROLE_KEY  (mesma chave já usada no Zeabur)
#   TMDB_API_KEY               (mesma chave já usada no Zeabur)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar sincronização Xtream API
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node xtream-sync-standalone.js
