name: Patch TV Live Adult + Fallback
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore LiveTv + Player (versao boa)
        run: |
          BASE="https://raw.githubusercontent.com/StartStatic1/streamflixvip-zeabur"
          # Commit conhecido com LiveTvScreen/LivePlayer completos
          GOOD="f03cecc4798e01d7ccb037e6eec1059e90b7ff30"
          DIR="android-tv/app/src/main/java/com/streamflixvip/tv/ui/livetv"
          mkdir -p "$DIR"
          curl -fsSL "$BASE/$GOOD/$DIR/LiveTvScreen.kt" -o "$DIR/LiveTvScreen.kt"
          curl -fsSL "$BASE/$GOOD/$DIR/LivePlayerTvScreen.kt" -o "$DIR/LivePlayerTvScreen.kt"
          wc -c "$DIR/LiveTvScreen.kt" "$DIR/LivePlayerTvScreen.kt"
          grep -q LiveTvViewModel "$DIR/LiveTvScreen.kt"
          grep -q LivePlayerTvScreen "$DIR/LivePlayerTvScreen.kt"

      - name: Adult filter
        run: python3 scripts/patch_tv_adult.py

      - name: Fallback timeout
        run: python3 scripts/patch_tv_fallback.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android-tv/app/src/main/java/com/streamflixvip/tv/ui/livetv/
          git commit -m "fix(tv): ocultar adulto + fallback timeout fontes" || echo nothing
          git push
