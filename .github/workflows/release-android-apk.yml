name: Build Android APK - Release (Publicar)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nome da versao (ex: 4.4.0)'
        required: true
        type: string
      release_notes:
        description: 'O que mudou nesta versao (aparece na tela de update do app)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Calcular novo versionCode (incrementa o atual em +1)
        id: version
        run: |
          CURRENT=$(grep -oP 'versionCode\s*=\s*\K\d+' android/app/build.gradle.kts)
          NEW=$((CURRENT + 1))
          echo "Versao atual: $CURRENT -> nova: $NEW"
          echo "code=$NEW" >> "$GITHUB_OUTPUT"

      - name: Atualizar versionCode/versionName no build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.code }}/" android/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ inputs.version_name }}\"/" android/app/build.gradle.kts
          echo "--- Conferindo ---"
          grep -E "versionCode|versionName" android/app/build.gradle.kts

      - name: Setup Gradle 8.7 (oficial, com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Gerar wrapper (retry se services.gradle.org falhar)
        working-directory: android
        run: |
          set +e
          for i in 1 2 3; do
            if gradle wrapper --gradle-version 8.7; then
              echo "wrapper ok (tentativa $i)"
              break
            fi
            echo "falha tentativa $i — aguardando..."
            sleep $((i * 15))
            if [ "$i" = "3" ]; then
              echo "Falha ao gerar wrapper; seguindo com gradle global"
            fi
          done
          set -e
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Restaurar keystore fixa
        working-directory: android
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Buildar APK de release
        working-directory: android
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: streamflixvip123
          DEBUG_KEY_ALIAS: streamflixvip-debug
          DEBUG_KEY_PASSWORD: streamflixvip123
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-release-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publicar APK em Public/downloads
        run: cp android/app/build/outputs/apk/release/app-release.apk Public/downloads/app-latest.apk

      - name: Atualizar app-version.json
        run: |
          cat > app-version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ inputs.version_name }}",
            "apkUrl": "https://streamflixvip.online/downloads/app-latest.apk",
            "forceUpdate": true,
            "releaseNotes": "${{ inputs.release_notes }}"
          }
          EOF
          cat app-version.json

      - name: Commit + push do APK novo, versao e JSON atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts Public/downloads/app-latest.apk app-version.json
          git commit -m "release: v${{ inputs.version_name }} (versionCode ${{ steps.version.outputs.code }})"
          git push
