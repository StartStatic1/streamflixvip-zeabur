name: Build Android APK - Release (Publicar)

# Só roda quando VOCÊ aciona manualmente (aba Actions → este workflow
# → "Run workflow"). Não dispara sozinho com push, de propósito —
# publicar uma versão nova pros usuários é uma decisão consciente,
# não algo que deveria acontecer a cada commit.
#
# O que faz sozinho a partir do número de versão que você informar:
#   1. Incrementa o versionCode no build.gradle.kts (+1 sobre o atual)
#   2. Builda o APK de RELEASE (assinado, debuggable=false — o que
#      lojas terceiras exigem, diferente do workflow de debug)
#   3. Publica o APK em Public/downloads/app-latest.apk
#   4. Atualiza app-version.json com o novo número (o app detecta
#      sozinho na próxima vez que abrir)
#   5. Comita e sobe tudo — build.gradle.kts, o APK novo e o JSON —
#      de volta pro repositório

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nome da versão (ex: 4.4.0)'
        required: true
        type: string
      release_notes:
        description: 'O que mudou nesta versão (aparece na tela de update do app)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Calcular novo versionCode (incrementa o atual em +1)
        id: version
        run: |
          CURRENT=$(grep -oP 'versionCode\s*=\s*\K\d+' android/app/build.gradle.kts)
          NEW=$((CURRENT + 1))
          echo "Versão atual: $CURRENT → nova: $NEW"
          echo "code=$NEW" >> "$GITHUB_OUTPUT"

      - name: Atualizar versionCode/versionName no build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.code }}/" android/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ inputs.version_name }}\"/" android/app/build.gradle.kts
          echo "--- Conferindo ---"
          grep -E "versionCode|versionName" android/app/build.gradle.kts

      - name: Gerar wrapper do Gradle (versão fixa 8.7)
        working-directory: android
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Dar permissão de execução ao gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Restaurar keystore fixa (mesma chave sempre — evita conflito de assinatura ao atualizar)
        working-directory: android
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Buildar APK de release (debuggable=false, aceito por lojas de terceiros)
        working-directory: android
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: streamflixvip123
          DEBUG_KEY_ALIAS: streamflixvip-debug
          DEBUG_KEY_PASSWORD: streamflixvip123
        run: ./gradlew assembleRelease --no-daemon

      - name: Enviar APK como artefato (backup/histórico no Actions)
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-release-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publicar APK em Public/downloads (o mesmo link que o app já usa)
        run: cp android/app/build/outputs/apk/release/app-release.apk Public/downloads/app-latest.apk

      - name: Atualizar app-version.json (o app passa a enxergar a atualização sozinho)
        run: |
          cat > app-version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ inputs.version_name }}",
            "apkUrl": "https://streamflixvip.online/downloads/app-latest.apk",
            "forceUpdate": true,
            "releaseNotes": "${{ inputs.release_notes }}"
          }
          EOF
          cat app-version.json

      - name: Commit + push do APK novo, versão e JSON atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts Public/downloads/app-latest.apk app-version.json
          git commit -m "release: v${{ inputs.version_name }} (versionCode ${{ steps.version.outputs.code }})"
          git push
