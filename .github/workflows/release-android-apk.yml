name: Build Android APK - Release (Publicar)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ex: 11.2.0)'
        required: true
        type: string
      release_notes:
        description: 'Notas da atualizacao'
        required: false
        default: 'Melhorias e correcoes'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar versionCode
        id: version
        run: |
          NAME="${{ inputs.version_name }}"
          if echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            MAJOR=$(echo "$NAME" | cut -d. -f1)
            MINOR=$(echo "$NAME" | cut -d. -f2)
            PATCH=$(echo "$NAME" | cut -d. -f3)
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            CODE=$(date +%s | tail -c 7)
          fi
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"$NAME\"/" android/app/build.gradle.kts || true
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = $CODE/" android/app/build.gradle.kts || true
          fi

      - name: Instalar Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Gerar wrapper (retry se services.gradle.org falhar)
        working-directory: android
        run: |
          set +e
          for i in 1 2 3; do
            if gradle wrapper --gradle-version 8.7; then
              echo "wrapper ok (tentativa $i)"
              break
            fi
            echo "falha tentativa $i — aguardando..."
            sleep $((i * 15))
            if [ "$i" = "3" ]; then
              echo "Falha ao gerar wrapper; seguindo com gradle global"
            fi
          done
          set -e
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Restaurar keystore fixa
        working-directory: android
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Buildar APK de release
        working-directory: android
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: streamflixvip123
          DEBUG_KEY_ALIAS: streamflixvip-debug
          DEBUG_KEY_PASSWORD: streamflixvip123
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-release-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publicar APK em Public/downloads
        run: |
          mkdir -p Public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk Public/downloads/app-latest.apk

      - name: Atualizar app-version.json
        run: |
          cat > app-version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ inputs.version_name }}",
            "apkUrl": "https://streamflixvip.online/downloads/app-latest.apk",
            "forceUpdate": true,
            "releaseNotes": "${{ inputs.release_notes }}"
          }
          EOF
          cat app-version.json

      - name: Commit + push do APK novo, versao e JSON atualizados
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # So os 3 arquivos do release (evita lixo do gradle/wrapper bloquear)
          git add -f android/app/build.gradle.kts Public/downloads/app-latest.apk app-version.json

          if git diff --cached --quiet; then
            echo "Nada para commit (ja estava igual)"
          else
            git commit -m "release: v${{ inputs.version_name }} (versionCode ${{ steps.version.outputs.code }})"
          fi

          # Descarta mudancas locais nao commitadas (wrapper, build dirs, keystore)
          # para o pull --rebase nao falhar com "unstaged changes"
          git restore --staged . 2>/dev/null || true
          git restore . 2>/dev/null || true
          git clean -fd -e Public/downloads -e app-version.json -e android/app/build.gradle.kts 2>/dev/null || true

          # Re-adiciona e garante commit se clean apagou algo (nao deve)
          git add -f android/app/build.gradle.kts Public/downloads/app-latest.apk app-version.json
          if ! git diff --cached --quiet; then
            git commit -m "release: v${{ inputs.version_name }} (versionCode ${{ steps.version.outputs.code }})" || true
          fi

          # Puxa main e publica — se falhar, o job fica VERMELHO
          git fetch origin main
          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "OK publicado no main"
          git log -1 --oneline
