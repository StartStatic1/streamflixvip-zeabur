name: Fix Sources VIP UX
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 scripts/fix_sources_vip_ux.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/data/CatalogRepository.kt
          git commit -m "fix(mobile): free ve fontes liberadas; VIP nao fura; sem falso sem fonte" || echo nothing
          git push
