name: Patch Mobile VIP + Update + Resume
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 1) Precos VIP
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/vip/VipSection.kt")
          t = p.read_text()
          t = t.replace('price = "R$ 19,90"', 'price = "R$ 9,90"')
          t = t.replace('viewModel.startPayment(19.90, "VIP 30 Dias", 720)', 'viewModel.startPayment(9.90, "VIP 30 Dias", 720)')
          t = t.replace('price = "R$ 49,90"', 'price = "R$ 24,90"')
          t = t.replace('badge = "Economize R$ 9,80"', 'badge = "Economize R$ 4,80"')
          t = t.replace('viewModel.startPayment(49.90, "VIP 90 Dias", 2160)', 'viewModel.startPayment(24.90, "VIP 90 Dias", 2160)')
          # 3x 9.90 = 29.70; 29.70-24.90 = 4.80
          p.write_text(t)
          assert 'R$ 9,90' in t and 'R$ 24,90' in t and 'R$ 99,90' in t
          print('prices ok')
          PY

      - name: 2) ApkInstaller + FileProvider + MainActivity in-app update
        run: |
          python3 << 'PY'
          from pathlib import Path

          # ApkInstaller for mobile (same logic as TV)
          apk = r'''package com.streamflixvip.app.update

import android.content.Context
import android.content.Intent
import android.net.Uri
import android.os.Build
import android.provider.Settings
import androidx.core.content.FileProvider
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import okhttp3.OkHttpClient
import okhttp3.Request
import java.io.File
import java.util.concurrent.TimeUnit

/** Baixa o APK dentro do app (sem abrir navegador) e dispara o instalador. */
object ApkInstaller {

    private val client by lazy {
        OkHttpClient.Builder()
            .connectTimeout(30, TimeUnit.SECONDS)
            .readTimeout(5, TimeUnit.MINUTES)
            .writeTimeout(2, TimeUnit.MINUTES)
            .followRedirects(true)
            .followSslRedirects(true)
            .build()
    }

    suspend fun download(
        context: Context,
        apkUrl: String,
        onProgress: (Int) -> Unit,
    ): File = withContext(Dispatchers.IO) {
        val dir = File(context.cacheDir, "updates").apply { mkdirs() }
        val out = File(dir, "streamflix-update.apk")
        if (out.exists()) out.delete()

        val request = Request.Builder()
            .url(apkUrl)
            .header("User-Agent", "StreamFlixVIP-Mobile-Updater")
            .build()

        client.newCall(request).execute().use { response ->
            if (!response.isSuccessful) {
                throw IllegalStateException("Download falhou: HTTP ${response.code}")
            }
            val body = response.body ?: throw IllegalStateException("Resposta vazia")
            val total = body.contentLength()
            body.byteStream().use { input ->
                out.outputStream().use { output ->
                    val buffer = ByteArray(128 * 1024)
                    var read: Int
                    var done = 0L
                    var lastPct = -1
                    while (input.read(buffer).also { read = it } != -1) {
                        output.write(buffer, 0, read)
                        done += read
                        if (total > 0) {
                            val pct = ((done * 100) / total).toInt().coerceIn(0, 100)
                            if (pct != lastPct) {
                                lastPct = pct
                                onProgress(pct)
                            }
                        }
                    }
                    output.flush()
                }
            }
        }
        onProgress(100)
        out
    }

    fun canInstallPackages(context: Context): Boolean {
        return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            context.packageManager.canRequestPackageInstalls()
        } else true
    }

    fun openInstallPermissionSettings(context: Context) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val intent = Intent(
                Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                Uri.parse("package:${context.packageName}"),
            ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            context.startActivity(intent)
        }
    }

    fun install(context: Context, apkFile: File) {
        val uri = FileProvider.getUriForFile(
            context,
            "${context.packageName}.fileprovider",
            apkFile,
        )
        val intent = Intent(Intent.ACTION_VIEW).apply {
            setDataAndType(uri, "application/vnd.android.package-archive")
            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
        }
        context.startActivity(intent)
    }
}
'''
          Path("android/app/src/main/java/com/streamflixvip/app/update").mkdir(parents=True, exist_ok=True)
          Path("android/app/src/main/java/com/streamflixvip/app/update/ApkInstaller.kt").write_text(apk)

          # file_paths.xml
          Path("android/app/src/main/res/xml").mkdir(parents=True, exist_ok=True)
          fp = Path("android/app/src/main/res/xml/file_paths.xml")
          if not fp.exists() or "apk_cache" not in fp.read_text():
              fp.write_text('''<?xml version="1.0" encoding="utf-8"?>
<paths>
    <cache-path name="apk_cache" path="." />
    <files-path name="apk_files" path="." />
    <external-cache-path name="apk_ext_cache" path="." />
    <external-files-path name="apk_ext_files" path="." />
</paths>
''')

          # Manifest
          m = Path("android/app/src/main/AndroidManifest.xml")
          mt = m.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in mt:
              mt = mt.replace(
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />',
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              )
          if "fileprovider" not in mt:
              mt = mt.replace(
                  "    </application>\n</manifest>",
                  '''        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />
        </provider>

    </application>
</manifest>''',
              )
          m.write_text(mt)

          # MainActivity - in-app download
          ma = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = ma.read_text()
          if "ApkInstaller.download" not in t:
              if "import kotlinx.coroutines.launch" not in t:
                  t = t.replace(
                      "import androidx.compose.runtime",
                      "import kotlinx.coroutines.launch\nimport androidx.compose.runtime",
                      1,
                  )
              old = '''            onDownloadClick = {
                isDownloadingUpdate = true
                try {
                    val intent = android.content.Intent(
                        android.content.Intent.ACTION_VIEW,
                        android.net.Uri.parse(updateInfo!!.apkUrl),
                    )
                    context.startActivity(intent)
                } catch (_: Exception) {
                } finally {
                    isDownloadingUpdate = false
                }
            },'''
              new = '''            onDownloadClick = {
                val url = updateInfo!!.apkUrl
                if (url.isBlank()) return@UpdateRequiredScreen
                isDownloadingUpdate = true
                // scope from setContent rememberCoroutineScope if available; fallback
                (context as? androidx.activity.ComponentActivity)?.lifecycleScope?.launch {
                    try {
                        if (!com.streamflixvip.app.update.ApkInstaller.canInstallPackages(context)) {
                            com.streamflixvip.app.update.ApkInstaller.openInstallPermissionSettings(context)
                            isDownloadingUpdate = false
                            return@launch
                        }
                        val file = com.streamflixvip.app.update.ApkInstaller.download(context, url) { }
                        com.streamflixvip.app.update.ApkInstaller.install(context, file)
                    } catch (_: Exception) {
                    } finally {
                        isDownloadingUpdate = false
                    }
                } ?: run {
                    // fallback browser se nao houver lifecycleScope
                    try {
                        context.startActivity(
                            android.content.Intent(
                                android.content.Intent.ACTION_VIEW,
                                android.net.Uri.parse(url),
                            )
                        )
                    } catch (_: Exception) {}
                    isDownloadingUpdate = false
                }
            },'''
              if old not in t:
                  raise SystemExit('MainActivity download block not found')
              t = t.replace(old, new, 1)
              if "import androidx.lifecycle.lifecycleScope" not in t:
                  t = t.replace(
                      "import androidx.activity.compose.setContent",
                      "import androidx.activity.compose.setContent\nimport androidx.lifecycle.lifecycleScope",
                      1,
                  )
              ma.write_text(t)
          print('update in-app ok')
          PY

      - name: 3) Continuar assistindo vai direto ao player
        run: |
          python3 << 'PY'
          from pathlib import Path

          # DetailScreen: add resumeSeconds + auto resume play
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt")
          t = p.read_text()
          if "resumeSeconds: Int = 0" not in t:
              t = t.replace(
                  "fun DetailScreen(\n    viewModel: DetailViewModel,\n    onPlaySource: (source: VipSource, season: Int, episode: Int, title: String, posterPath: String?) -> Unit,",
                  "fun DetailScreen(\n    viewModel: DetailViewModel,\n    resumeSeconds: Int = 0,\n    initialSeason: Int = -1,\n    initialEpisode: Int = -1,\n    onPlaySource: (source: VipSource, season: Int, episode: Int, title: String, posterPath: String?) -> Unit,",
                  1,
              )

          # Insert auto-resume after pendingWatch state and before when(state)
          if "autoResumedContinue" not in t:
              anchor = "    var showMovieServerPicker by remember { mutableStateOf(false) }\n"
              inject = '''    var showMovieServerPicker by remember { mutableStateOf(false) }
    var autoResumedContinue by remember { mutableStateOf(false) }

    // Continuar assistindo: pula detalhe/servidor e vai ao player interno
    val successForResume = state as? DetailUiState.Success
    LaunchedEffect(successForResume, resumeSeconds) {
        if (autoResumedContinue) return@LaunchedEffect
        if (resumeSeconds <= 0) return@LaunchedEffect
        val s = successForResume ?: return@LaunchedEffect
        autoResumedContinue = true
        val title = s.details.title ?: s.details.name ?: "Sem titulo"
        val posterPath = s.details.poster_path
        if (s.details is ... ) { }
        // movie: fontes ja no state
        val movieSources = s.movieSources
        if (movieSources.isNotEmpty() && initialSeason <= 0) {
            onPlaySource(movieSources.first(), 0, 0, title, posterPath)
            return@LaunchedEffect
        }
        // serie: carrega fontes do EP salvo e toca
        if (initialSeason > 0) {
            val ep = initialEpisode.coerceAtLeast(1)
            viewModel.loadEpisodeSources(initialSeason, ep) { source ->
                onPlaySource(source, initialSeason, ep, title, posterPath)
            }
        }
    }
'''
              # Fix invalid Kotlin - don't use `s.details is`
              inject = '''    var showMovieServerPicker by remember { mutableStateOf(false) }
    var autoResumedContinue by remember { mutableStateOf(false) }

    val successForResume = state as? DetailUiState.Success
    LaunchedEffect(successForResume, resumeSeconds) {
        if (autoResumedContinue) return@LaunchedEffect
        if (resumeSeconds <= 0) return@LaunchedEffect
        val s = successForResume ?: return@LaunchedEffect
        autoResumedContinue = true
        val title = s.details.title ?: s.details.name ?: "Sem titulo"
        val posterPath = s.details.poster_path
        val movieSources = s.movieSources
        if (movieSources.isNotEmpty() && initialSeason <= 0) {
            onPlaySource(movieSources.first(), 0, 0, title, posterPath)
            return@LaunchedEffect
        }
        if (initialSeason > 0) {
            val ep = initialEpisode.coerceAtLeast(1)
            viewModel.loadEpisodeSources(initialSeason, ep) { source ->
                onPlaySource(source, initialSeason, ep, title, posterPath)
            }
        }
    }
'''
              if anchor not in t:
                  raise SystemExit('showMovieServerPicker anchor missing')
              t = t.replace(anchor, inject, 1)

          if "import androidx.compose.runtime.LaunchedEffect" not in t and "LaunchedEffect" in t:
              # likely already have runtime.*
              pass
          p.write_text(t)

          # MainActivity pass resumeSeconds and seasons to DetailScreen
          ma = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = ma.read_text()
          old = "DetailScreen(\n                    viewModel = viewModel,\n                    onPlaySource ="
          new = "DetailScreen(\n                    viewModel = viewModel,\n                    resumeSeconds = resumeSeconds,\n                    initialSeason = initialSeason,\n                    initialEpisode = initialEpisode,\n                    onPlaySource ="
          if "resumeSeconds = resumeSeconds" not in t:
              if old not in t:
                  raise SystemExit('DetailScreen call not found')
              t = t.replace(old, new, 1)
              ma.write_text(t)
          print('resume direct play ok')
          PY

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git status
          git commit -m "feat(mobile): VIP 9,90/24,90 + update in-app + continuar assistindo no player" || echo nothing
          git push
