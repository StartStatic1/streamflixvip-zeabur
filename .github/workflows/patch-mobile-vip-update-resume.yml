name: Patch Mobile VIP + Update + Resume
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile patches
        run: python3 scripts/patch_mobile_vip_update_resume.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "feat(mobile): VIP 9,90/24,90 + update in-app + continuar assistindo no player" || echo nothing
          git push
