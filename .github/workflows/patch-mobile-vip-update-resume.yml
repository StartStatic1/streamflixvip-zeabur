name: Patch Mobile VIP + Update + Resume
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run patch script
        run: |
          set -e
          cat scripts/pm.b64.0 scripts/pm.b64.1 scripts/pm.b64.2 | base64 -d > scripts/patch_mobile_vip_update_resume.py
          python3 scripts/patch_mobile_vip_update_resume.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/ scripts/patch_mobile_vip_update_resume.py
          git commit -m "feat(mobile): VIP 9,90/24,90 + update in-app + continuar assistindo no player" || echo nothing
          git push
