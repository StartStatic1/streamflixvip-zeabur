name: Patch Online Subtitles
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble patch script
        run: python3 scripts/assemble_sub_patch.py
      - name: Apply to PlayerScreen
        run: python3 scripts/patch_online_subs.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt scripts/patch_online_subs.py
          git commit -m "feat(player): legendas online OpenSubtitles opcionais" || echo nothing
          git push
