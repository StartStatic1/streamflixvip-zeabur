name: fix-detail-and-subs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_detail_loading_catalog.py'
      - 'scripts/fix_online_sub_merge.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix detail catalog flash
        run: python3 scripts/fix_detail_loading_catalog.py
      - name: Fix online subtitle merge
        run: python3 scripts/fix_online_sub_merge.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt \
                  android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix: catalog loading flash + legenda online MergingMediaSource"
            git push
          fi
