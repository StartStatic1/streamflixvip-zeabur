name: patch-anime-order
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_anime_id_order.py
      - run: |
          git config user.name bot
          git config user.email bot@local
          git add lib/stremio-addons.js
          git diff --cached --quiet || (git commit -m "fix: pergunta AniList antes do TMDB" && git push)
