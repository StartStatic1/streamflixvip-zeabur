name: Fix Subtitle Persist
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Persist subtitles
        run: python3 scripts/fix_subtitle_persist.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): gravar legenda online em filesDir e reaplicar" || echo nothing
          git push
