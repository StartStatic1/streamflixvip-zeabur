name: fix-continue-watch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-continue-watch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch player + progress
        run: |
          python3 << 'END'
          from pathlib import Path

          # --- ProgressRepository: limiar menor (10s) ---
          p = Path('android/app/src/main/java/com/streamflixvip/app/data/ProgressRepository.kt')
          t = p.read_text()
          t2 = t.replace('if (positionSeconds < 15) return', 'if (positionSeconds < 10) return', 1)
          if t2 != t:
              p.write_text(t2)
              print('progress threshold 10s')
          else:
              print('threshold already or missing')

          # --- PlayerScreen: embed grava progresso estimado ---
          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt')
          t = p.read_text()

          old_call = '''    } else {
        EmbedWebView(url = currentResolvedUrl)
    }
}'''
          new_call = '''    } else {
        EmbedWebView(
            url = currentResolvedUrl,
            userId = userId,
            accessToken = accessToken,
            tmdbId = tmdbId,
            mediaType = mediaType,
            season = season,
            episode = episode,
            title = title,
            posterPath = posterPath,
        )
    }
}'''
          if 'EmbedWebView(\n            url = currentResolvedUrl' not in t and old_call in t:
              t = t.replace(old_call, new_call, 1)
              print('embed call OK')
          elif 'userId = userId' in t and 'EmbedWebView(' in t:
              print('embed call already')
          else:
              # try looser
              if 'EmbedWebView(url = currentResolvedUrl)' in t:
                  t = t.replace(
                      'EmbedWebView(url = currentResolvedUrl)',
                      'EmbedWebView(url = currentResolvedUrl, userId = userId, accessToken = accessToken, tmdbId = tmdbId, mediaType = mediaType, season = season, episode = episode, title = title, posterPath = posterPath)',
                      1,
                  )
                  print('embed call one-line OK')
              else:
                  print('WARN embed call')

          old_sig = '''@SuppressLint("SetJavaScriptEnabled")
@Composable
private fun EmbedWebView(url: String) {
    Box(modifier = Modifier.fillMaxSize()) {
        var isLoading by remember { mutableStateOf(true) }'''

          new_sig = '''@SuppressLint("SetJavaScriptEnabled")
@Composable
private fun EmbedWebView(
    url: String,
    userId: String? = null,
    accessToken: String? = null,
    tmdbId: Int = 0,
    mediaType: String = "movie",
    season: Int = 0,
    episode: Int = 0,
    title: String = "",
    posterPath: String? = null,
) {
    // Embed (iframe) nao expoe posicao real — gravamos progresso estimado
    // enquanto a tela fica aberta, para Continuar assistindo funcionar.
    val progressRepository = remember { ProgressRepository() }
    LaunchedEffect(userId, accessToken, tmdbId, mediaType, season, episode) {
        if (userId == null || accessToken == null || tmdbId <= 0) return@LaunchedEffect
        delay(12_000L)
        var pos = 15
        val estDuration = if (mediaType == "tv") 2700 else 5400
        while (true) {
            try {
                progressRepository.saveProgress(
                    accessToken, userId, tmdbId, mediaType, season, episode,
                    title, posterPath, pos, estDuration,
                )
            } catch (_: Exception) { }
            delay(15_000L)
            pos += 15
            if (pos > estDuration - 60) break
        }
    }
    Box(modifier = Modifier.fillMaxSize()) {
        var isLoading by remember { mutableStateOf(true) }'''

          if 'progress estimado' not in t and 'progresso estimado' not in t:
              if old_sig in t:
                  t = t.replace(old_sig, new_sig, 1)
                  print('embed body OK')
              else:
                  print('WARN embed sig')
          else:
              print('embed body already')

          # Native: abaixa filtro local de 15s para 10s
          t = t.replace('if (positionMs < 15_000L) return', 'if (positionMs < 10_000L) return')
          t = t.replace('if (positionSeconds >= 15)', 'if (positionSeconds >= 10)')

          # garantir imports delay / ProgressRepository (ja usados no NativePlayer)
          if 'import com.streamflixvip.app.data.ProgressRepository' not in t:
              t = t.replace(
                  'package com.streamflixvip.app.ui.player\n',
                  'package com.streamflixvip.app.ui.player\n\nimport com.streamflixvip.app.data.ProgressRepository\n',
                  1,
              )
              print('import ProgressRepository')

          p.write_text(t)
          print('PlayerScreen size', p.stat().st_size)
          print('DONE')
          END
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/
          git commit -m "fix(app): gravar continuar assistindo tambem no player embed" || echo nothing
          git push
