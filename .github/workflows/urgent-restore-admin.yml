name: urgent-restore-admin

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/urgent-restore-admin.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Restore good admin-vip.js
        run: |
          set -e
          echo "current size: $(wc -c < api/admin-vip.js)"
          FOUND=
          for c in $(git log --pretty=format:%H -- api/admin-vip.js | head -20); do
            git show "$c:api/admin-vip.js" > /tmp/av.js 2>/dev/null || continue
            SZ=$(wc -c < /tmp/av.js)
            if [ "$SZ" -gt 20000 ] && ! grep -qx PLACEHOLDER /tmp/av.js; then
              if grep -q "list-live-tv-sources" /tmp/av.js; then
                cp /tmp/av.js api/admin-vip.js
                echo "OK restored from $c size=$SZ"
                FOUND=1
                break
              fi
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "FAIL no good version"
            exit 1
          fi
          wc -c api/admin-vip.js
          head -3 api/admin-vip.js
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin-vip.js
          git commit -m "fix: restore admin-vip.js after accidental PLACEHOLDER" || echo nothing
          git push
