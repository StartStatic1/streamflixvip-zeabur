name: patch-live-tv-admin
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore placeholders and MAX_SOURCES
        run: |
          set -e
          for f in api/live-tv.js api/admin-vip.js; do
            sz=$(wc -c < "$f" || echo 0)
            echo "check $f size=$sz"
            if grep -q PLACEHOLDER "$f" 2>/dev/null || [ "$sz" -lt 200 ]; then
              echo "Restoring $f"
              found=0
              for c in $(git log --pretty=format:%H -- "$f"); do
                headc=$(git show "$c:$f" 2>/dev/null | head -c 30 || true)
                case "$headc" in
                  *PLACEHOLDER*) continue ;;
                  *)
                    git show "$c:$f" > "$f"
                    echo "Restored $f from $c ($(wc -c < "$f") bytes)"
                    found=1
                    break
                    ;;
                esac
              done
              if [ "$found" != 1 ]; then echo "FAILED $f"; exit 1; fi
            fi
          done
          sed -i 's/const MAX_SOURCES = 3;/const MAX_SOURCES = 5;/' api/live-tv.js
          grep MAX_SOURCES api/live-tv.js
          wc -c api/live-tv.js api/admin-vip.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-tv.js api/admin-vip.js
          git commit -m "fix(api): restore live-tv and admin-vip; MAX_SOURCES=5" || echo nothing
          git push
