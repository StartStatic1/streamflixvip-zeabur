name: fix-detail-fast-open
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_detail_fast_open.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_detail_fast_open.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailViewModel.kt \
                  android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "perf: detalhe abre so com TMDB; vip e fontes em background"
            git push
          fi
