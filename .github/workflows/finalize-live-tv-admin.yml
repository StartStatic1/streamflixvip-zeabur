name: finalize-live-tv-admin

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI patch
        run: python3 scripts/apply_livetv_ui.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Public/admin.html api/admin-vip.js
          git status
          git commit -m "feat(admin): aba TV ao vivo + update-live-tv-source; remove Embeds" || echo nothing
          git push
