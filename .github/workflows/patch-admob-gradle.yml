name: Patch AdMob Gradle
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add AdMob dependency
        run: |
          if ! grep -q play-services-ads android/app/build.gradle.kts; then
            sed -i 's|implementation("com.startapp:inapp-sdk:5.1.0")|implementation("com.startapp:inapp-sdk:5.1.0")\n\n    // Google AdMob\n    implementation("com.google.android.gms:play-services-ads:23.3.0")|' android/app/build.gradle.kts
          fi
          if ! grep -q 'com.google.android.gms.ads' android/app/proguard-rules.pro; then
            printf '\n# AdMob / GMS\n-keep class com.google.android.gms.ads.** { *; }\n-dontwarn com.google.android.gms.ads.**\n' >> android/app/proguard-rules.pro
          fi
          grep -n play-services-ads android/app/build.gradle.kts
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/build.gradle.kts android/app/proguard-rules.pro
          git commit -m "feat(mobile): dependencia AdMob + proguard" || echo nothing
          git push
