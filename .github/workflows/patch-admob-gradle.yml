name: Patch AdMob Gradle
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add AdMob dep and proguard
        run: |
          python3 << 'PY'
          from pathlib import Path

          g = Path("android/app/build.gradle.kts")
          t = g.read_text()
          if "play-services-ads" not in t:
              t = t.replace(
                  'implementation("com.startapp:inapp-sdk:5.1.0")',
                  'implementation("com.startapp:inapp-sdk:5.1.0")\n\n    // Google AdMob\n    implementation("com.google.android.gms:play-services-ads:23.3.0")',
                  1,
              )
              g.write_text(t)
              print("gradle ok")
          else:
              print("gradle already")

          pr = Path("android/app/proguard-rules.pro")
          pt = pr.read_text()
          if "com.google.android.gms.ads" not in pt:
              pt += """

# AdMob / GMS
-keep class com.google.android.gms.ads.** { *; }
-dontwarn com.google.android.gms.ads.**
"""
              pr.write_text(pt)
              print("proguard ok")
          else:
              print("proguard already")
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/build.gradle.kts android/app/proguard-rules.pro
          git commit -m "feat(mobile): dependencia AdMob + proguard" || echo nothing
          git push
