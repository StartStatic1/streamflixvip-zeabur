name: AdMob Production Flag
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set USE_TEST_ADS false
        run: |
          FILE=android/app/src/main/java/com/streamflixvip/app/ads/AdsHelper.kt
          sed -i 's/const val USE_TEST_ADS = true/const val USE_TEST_ADS = false/' "$FILE"
          grep -n "USE_TEST_ADS" "$FILE" | head -5
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ads/AdsHelper.kt
          git commit -m "feat(mobile): AdMob producao USE_TEST_ADS=false" || echo nothing
          git push
