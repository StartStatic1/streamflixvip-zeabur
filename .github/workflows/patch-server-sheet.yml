name: Patch server sheet UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-server-sheet.py'
      - 'android/app/src/main/java/com/streamflixvip/app/ui/detail/ServerPickerUi.kt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-server-sheet.py
      - name: Commit if changed
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflixvip.online"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ui: wire ServerSourceCard + add-ons VIP-only no sheet"
            git push
          fi
