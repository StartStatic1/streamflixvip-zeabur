name: fix-mkv-direct-play

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-mkv-direct-play.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch isDirectPlayable for MKV
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/streamflixvip/app/network/SupabaseApi.kt')
          t = p.read_text()
          old = '''    val isDirectPlayable: Boolean
        get() {
            val lower = source_url.lowercase()
            return lower.endsWith(".m3u8") ||
                lower.endsWith(".mp4") ||
                lower.contains("/stream-proxy") // j\u00e1 \u00e9 o proxy do site, serve stream direto
        }'''
          # try without unicode escape
          old2 = '''    val isDirectPlayable: Boolean
        get() {
            val lower = source_url.lowercase()
            return lower.endsWith(".m3u8") ||
                lower.endsWith(".mp4") ||
                lower.contains("/stream-proxy")'''
          new = '''    val isDirectPlayable: Boolean
        get() {
            // Path sem query/hash — R2/CDN usam ?X-Amz-Signature=...
            val path = source_url.lowercase().substringBefore('?').substringBefore('#')
            val lower = source_url.lowercase()
            return path.endsWith(".m3u8") ||
                path.endsWith(".mp4") ||
                path.endsWith(".mkv") ||
                path.endsWith(".webm") ||
                path.endsWith(".m4v") ||
                path.endsWith(".mov") ||
                path.endsWith(".ts") ||
                path.endsWith(".m2ts") ||
                lower.contains("/stream-proxy")
        }'''
          if 'path.endsWith(".mkv")' in t:
              print('already patched')
          elif old2 in t:
              # replace from old2 through closing brace of getter
              idx = t.find(old2)
              # find matching closing of get()
              rest = t[idx:]
              # naive: find "        }\n\n    /**" after
              end = rest.find('        }\n')
              if end < 0:
                  raise SystemExit('end not found')
              end += len('        }\n')
              t = t[:idx] + new + '\n' + rest[end:]
              p.write_text(t)
              print('patched via old2')
          else:
              print(repr(t[t.find('isDirectPlayable')-20:t.find('isDirectPlayable')+400]))
              raise SystemExit('pattern not found')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/streamflixvip/app/network/SupabaseApi.kt
          git commit -m "fix(player): MKV/webm/R2 como play direto no ExoPlayer" || echo nothing
          git push
