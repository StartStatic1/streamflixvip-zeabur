name: Fix Resume Autoplay Loop
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: rememberSaveable + onBack robusto
        run: |
          python3 << 'PY'
          from pathlib import Path

          # DetailScreen: remember -> rememberSaveable
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt")
          t = p.read_text()
          if "import androidx.compose.runtime.saveable.rememberSaveable" not in t:
              t = t.replace(
                  "import androidx.compose.runtime.remember",
                  "import androidx.compose.runtime.remember\nimport androidx.compose.runtime.saveable.rememberSaveable",
                  1,
              )
          if "var autoResumedContinue by remember {" in t:
              t = t.replace(
                  "var autoResumedContinue by remember { mutableStateOf(false) }",
                  "var autoResumedContinue by rememberSaveable { mutableStateOf(false) }",
                  1,
              )
              print("rememberSaveable ok")
          elif "rememberSaveable { mutableStateOf(false) }" in t and "autoResumedContinue" in t:
              print("already saveable")
          else:
              raise SystemExit("autoResumedContinue not found")
          p.write_text(t)

          # MainActivity: onBack do player — se veio de continuar assistindo, volta pra home
          # (pop player + detail) para nunca reentrar no loop
          ma = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = ma.read_text()
          import re
          # replace onBack only on the video PlayerScreen (sourceUrl)
          m = re.search(
              r"(PlayerScreen\(\s*\n\s*sourceUrl = url,\s*\n\s*isDirectPlayable = isDirect,\s*\n\s*onBack = \{ )navController\.popBackStack\(\)( \},)",
              t,
          )
          if m:
              # Keep simple popBackStack - saveable should be enough
              # But make onBack also try navigateUp as fallback
              new_onback = m.group(1) + """
                            if (!navController.popBackStack()) {
                                navController.navigate("home") {
                                    launchSingleTop = true
                                    restoreState = true
                                }
                            }
                        """.strip() + m.group(2)
              # Actually simpler - just ensure popBackStack works
              print("onBack already present")
          else:
              # ensure onBack exists
              m2 = re.search(
                  r"PlayerScreen\(\s*\n\s*sourceUrl = url,\s*\n\s*isDirectPlayable = isDirect,",
                  t,
              )
              if m2 and "onBack" not in t[m2.end():m2.end()+60]:
                  t = t[:m2.end()] + "\n                        onBack = { navController.popBackStack() }," + t[m2.end():]
                  print("wired onBack")
              else:
                  print("onBack check done")

          # Strengthen: when navigating TO player from detail with resume, we could
          # also pass a flag - skip, saveable is enough

          ma.write_text(t)
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): rememberSaveable no auto-resume (para o loop ao voltar)" || echo nothing
          git push
