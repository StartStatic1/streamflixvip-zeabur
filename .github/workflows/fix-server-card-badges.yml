name: fix-server-card-badges
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_server_card_badges.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_server_card_badges.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/ServerPickerUi.kt || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "ui: selos qualidade/audio no card; nome host limpo"
            git push
          fi
