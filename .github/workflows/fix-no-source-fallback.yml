name: Fix No Source Fallback
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository
        run: python3 scripts/fix_no_supabase_source_fallback.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/data/CatalogRepository.kt
          git commit -m "fix(mobile): nao furar VIP com fallback Supabase nas fontes" || echo nothing
          git push
