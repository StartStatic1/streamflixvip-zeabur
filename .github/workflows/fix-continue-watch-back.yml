name: Fix Continue Watch Series + Player Back
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 scripts/fix_continue_watch_back.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): serie continuar no player + voltar no player" || echo nothing
          git push
