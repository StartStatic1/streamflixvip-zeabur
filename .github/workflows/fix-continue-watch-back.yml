name: Fix Continue Watch Series + Player Back
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Series force autoplay + player back
        run: |
          python3 << 'PY'
          from pathlib import Path

          # 1) DetailViewModel: forceAutoPlay
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailViewModel.kt")
          t = p.read_text()
          if "forceAutoPlay" not in t:
              t = t.replace(
                  "fun loadEpisodeSources(season: Int, episode: Int, onAutoPlay: (VipSource) -> Unit) {",
                  "fun loadEpisodeSources(season: Int, episode: Int, forceAutoPlay: Boolean = false, onAutoPlay: (VipSource) -> Unit) {",
                  1,
              )
              old = """                sources.size > 1 -> {
                    _uiState.value = stillCurrent.copy(
                        episodeSources = sources,
                        isLoadingEpisodeSources = false,
                        showServerPickerForEpisode = episode,
                    )
                }"""
              new = """                sources.size > 1 -> {
                    if (forceAutoPlay) {
                        _uiState.value = stillCurrent.copy(
                            episodeSources = sources,
                            isLoadingEpisodeSources = false,
                            showServerPickerForEpisode = null,
                        )
                        onAutoPlay(sources.first())
                    } else {
                        _uiState.value = stillCurrent.copy(
                            episodeSources = sources,
                            isLoadingEpisodeSources = false,
                            showServerPickerForEpisode = episode,
                        )
                    }
                }"""
              if old not in t:
                  raise SystemExit("multi-source block not found")
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("DetailViewModel ok")
          else:
              print("DetailViewModel already has forceAutoPlay")

          # 2) DetailScreen: pass forceAutoPlay=true on continue watching
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt")
          t = p.read_text()
          old = "viewModel.loadEpisodeSources(initialSeason, ep) { src ->"
          new = "viewModel.loadEpisodeSources(initialSeason, ep, forceAutoPlay = true) { src ->"
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("DetailScreen forceAutoPlay ok")
          elif "forceAutoPlay = true" in t:
              print("DetailScreen already ok")
          else:
              raise SystemExit("loadEpisodeSources call in resume not found")

          # 3) PlayerScreen: onBack + BackHandler + botao voltar
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt")
          t = p.read_text()

          if "import androidx.activity.compose.BackHandler" not in t:
              t = t.replace(
                  "import androidx.compose.animation.AnimatedVisibility",
                  "import androidx.activity.compose.BackHandler\nimport androidx.compose.animation.AnimatedVisibility",
                  1,
              )
          if "import androidx.compose.material.icons.automirrored.filled.ArrowBack" not in t and "Icons.AutoMirrored.Filled.ArrowBack" not in t:
              # use filled Close or ArrowBack
              if "import androidx.compose.material.icons.filled.Close" not in t:
                  t = t.replace(
                      "import androidx.compose.material.icons.filled.BrightnessHigh",
                      "import androidx.compose.material.icons.filled.BrightnessHigh\nimport androidx.compose.material.icons.automirrored.filled.ArrowBack",
                      1,
                  )

          # Add onBack param to PlayerScreen
          if "onBack: () -> Unit" not in t.split("fun PlayerScreen")[1][:500]:
              t = t.replace(
                  "fun PlayerScreen(\n    sourceUrl: String,\n    isDirectPlayable: Boolean,",
                  "fun PlayerScreen(\n    sourceUrl: String,\n    isDirectPlayable: Boolean,\n    onBack: () -> Unit = {},",
                  1,
              )
              print("PlayerScreen param ok")

          # BackHandler at start of PlayerScreen body after DisposableEffects area - after first lines of function
          if "BackHandler" not in t:
              # Insert after orientation DisposableEffect block end - find "var resolvedUrl"
              anchor = "    var resolvedUrl by remember(sourceUrl)"
              if anchor not in t:
                  raise SystemExit("resolvedUrl anchor missing")
              t = t.replace(
                  anchor,
                  "    BackHandler { onBack() }\n\n    " + anchor,
                  1,
              )
              print("BackHandler ok")

          # Pass onBack to NativePlayer if it has its own controls - need button in NativePlayer
          # Add onBack to NativePlayer signature and a back button in top controls
          if "onBack: () -> Unit" not in t.split("fun NativePlayer")[1][:400]:
              t = t.replace(
                  "private fun NativePlayer(\n    url: String,",
                  "private fun NativePlayer(\n    url: String,\n    onBack: () -> Unit = {},",
                  1,
              )
              # Call site NativePlayer(
              t = t.replace(
                  """        NativePlayer(
            url = currentResolvedUrl,
            userId = userId,""",
                  """        NativePlayer(
            url = currentResolvedUrl,
            onBack = onBack,
            userId = userId,""",
                  1,
              )
              print("NativePlayer param ok")

          # Back button in top controls - near title AnimatedVisibility TopStart
          if "onBack()" in t and "ArrowBack" not in t[t.find("align(Alignment.TopStart)"):t.find("align(Alignment.TopStart)")+800]:
              marker = """            modifier = Modifier.align(Alignment.TopStart).statusBarsPadding().padding(start = 16.dp, end = 16.dp, top = 8.dp),
        ) {
            val epLabel"""
              if marker not in t:
                  # try alternate
                  print("WARN top controls marker not exact")
              else:
                  inject = """            modifier = Modifier.align(Alignment.TopStart).statusBarsPadding().padding(start = 8.dp, end = 16.dp, top = 8.dp),
        ) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                IconButton(onClick = onBack) {
                    Icon(
                        imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                        contentDescription = "Voltar",
                        tint = Color.White,
                    )
                }
            val epLabel"""
                  # Fix - need to close Row after title Column - more careful
                  # Simpler: put IconButton before Column
                  inject = """            modifier = Modifier.align(Alignment.TopStart).statusBarsPadding().padding(start = 4.dp, end = 16.dp, top = 4.dp),
        ) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                IconButton(onClick = onBack) {
                    Icon(
                        imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                        contentDescription = "Voltar",
                        tint = Color.White,
                    )
                }
                Column(Modifier.weight(1f)) {
            val epLabel"""
                  t = t.replace(marker, inject, 1)
                  # Close the extra Column and Row - find after epLabel block ends
                  # Original:
                  # Column { Text title; if epLabel Text }
                  # We changed to Row { IconButton; Column { val epLabel...
                  # Need closing braces for Column and Row after the original Column content
                  old_close = """                if (epLabel != null) {
                    Text(epLabel, color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                }
            }
        }"""
                  new_close = """                if (epLabel != null) {
                    Text(epLabel, color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                }
                }
            }
        }"""
                  if old_close in t:
                      t = t.replace(old_close, new_close, 1)
                      print("back button UI ok")
                  else:
                      print("WARN close braces not found")

          p.write_text(t)

          # 4) MainActivity pass onBack to PlayerScreen
          p = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = p.read_text()
          if "PlayerScreen(" in t and "onBack = { navController.popBackStack() }" not in t[t.find("PlayerScreen("):t.find("PlayerScreen(")+500]:
              t = t.replace(
                  """                    PlayerScreen(
                        sourceUrl = url,
                        isDirectPlayable = isDirect,""",
                  """                    PlayerScreen(
                        sourceUrl = url,
                        isDirectPlayable = isDirect,
                        onBack = { navController.popBackStack() },""",
                  1,
              )
              p.write_text(t)
              print("MainActivity onBack ok")
          else:
              print("MainActivity onBack check done")

          print("ALL DONE")
          PY

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): series continuar assistindo no player + botao/voltar no player" || echo nothing
          git push
