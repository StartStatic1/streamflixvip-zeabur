name: fix-detail-color-import
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_detail_color_import.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_detail_color_import.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "fix: import Color no DetailScreen (botao WhatsApp)"
            git push
          fi
