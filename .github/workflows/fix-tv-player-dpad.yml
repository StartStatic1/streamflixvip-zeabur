name: Fix TV Live Player D-pad
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix OK consumes chips + list focus
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android-tv/app/src/main/java/com/streamflixvip/tv/ui/livetv/LivePlayerTvScreen.kt")
          t = p.read_text()
          if "deixa Surface/onClick do chip receber OK" in t:
              print("already fixed")
              raise SystemExit(0)
          assert len(t) > 5000

          old = """                when (code) {
                    KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                        if (!controlsVisible) showControls() else {
                            controlsVisible = !controlsVisible
                            if (!controlsVisible) runCatching { rootFocus.requestFocus() }
                        }
                        true
                    }
                    KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_DPAD_UP -> {
                        if (!controlsVisible) { switchChannel(+1); true } else { showControls(); false }
                    }
                    KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_DPAD_DOWN -> {
                        if (!controlsVisible) { switchChannel(-1); true } else { showControls(); false }
                    }
                    KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
                        if (!controlsVisible) { showControls(); true } else { showControls(); false }
                    }
                    KeyEvent.KEYCODE_INFO, KeyEvent.KEYCODE_MENU -> {
                        channelListVisible = !channelListVisible
                        if (channelListVisible) controlsVisible = true
                        true
                    }
                    else -> if (!controlsVisible) { showControls(); true } else false
                }"""

          new = """                when (code) {
                    // Controles visiveis: OK deve ir para o chip focado
                    KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                        if (!controlsVisible) {
                            showControls()
                            true
                        } else {
                            false // deixa Surface/onClick do chip receber OK
                        }
                    }
                    KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                        if (!controlsVisible) showControls()
                        true
                    }
                    KeyEvent.KEYCODE_CHANNEL_UP -> {
                        switchChannel(+1); true
                    }
                    KeyEvent.KEYCODE_CHANNEL_DOWN -> {
                        switchChannel(-1); true
                    }
                    KeyEvent.KEYCODE_DPAD_UP -> {
                        if (!controlsVisible) { switchChannel(+1); true } else false
                    }
                    KeyEvent.KEYCODE_DPAD_DOWN -> {
                        if (!controlsVisible) { switchChannel(-1); true } else false
                    }
                    KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
                        if (!controlsVisible) { showControls(); true } else false
                    }
                    KeyEvent.KEYCODE_INFO, KeyEvent.KEYCODE_MENU -> {
                        aspectMenuVisible = false
                        channelListVisible = !channelListVisible
                        if (channelListVisible) controlsVisible = false
                        true
                    }
                    else -> if (!controlsVisible) { showControls(); true } else false
                }"""

          if old not in t:
              raise SystemExit("key handler block not found")
          t = t.replace(old, new, 1)

          # Aspecto: ciclo simples (Ajustar/Preencher/Esticar) no OK do chip
          old_a = """                if (aspectMenuVisible) {
                    Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                        LiveAspect.entries.forEach { mode ->
                            val selected = aspect == mode
                            LiveTvChip(
                                Icons.Filled.AspectRatio,
                                mode.label,
                                selected = selected,
                            ) {
                                aspect = mode
                                aspectMenuVisible = false
                                showControls()
                            }
                        }
                    }
                    Spacer(Modifier.height(12.dp))
                }

                Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    LiveTvChip(
                        Icons.Filled.AspectRatio,
                        if (aspectMenuVisible) "Fechar" else aspect.label,
                        Modifier.focusRequester(aspectFocus),
                        selected = aspectMenuVisible,
                    ) {
                        aspectMenuVisible = !aspectMenuVisible
                        showControls()
                    }"""
          new_a = """                Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    LiveTvChip(
                        Icons.Filled.AspectRatio,
                        aspect.label,
                        Modifier.focusRequester(aspectFocus),
                    ) {
                        aspect = LiveAspect.entries[(aspect.ordinal + 1) % LiveAspect.entries.size]
                        aspectMenuVisible = false
                        showControls()
                    }"""
          if old_a in t:
              t = t.replace(old_a, new_a, 1)
          else:
              print("WARN aspect block not found - maybe already simplified")

          # Lista: abre painel e esconde chips para nao roubar foco
          t = t.replace(
              """                        LiveTvChip(Icons.Filled.List, "Lista") {
                            aspectMenuVisible = false
                            channelListVisible = true
                            showControls()
                        }""",
              """                        LiveTvChip(Icons.Filled.List, "Lista") {
                            aspectMenuVisible = false
                            channelListVisible = true
                            controlsVisible = false
                        }""",
              1,
          )

          # BACK: fecha lista/controles antes de sair
          old_b = """    BackHandler {
        when {
            channelListVisible -> channelListVisible = false
            aspectMenuVisible -> aspectMenuVisible = false
            else -> onBack()
        }
    }"""
          new_b = """    BackHandler {
        when {
            channelListVisible -> {
                channelListVisible = false
                showControls()
            }
            aspectMenuVisible -> aspectMenuVisible = false
            controlsVisible -> {
                controlsVisible = false
                runCatching { rootFocus.requestFocus() }
            }
            else -> onBack()
        }
    }"""
          if old_b in t:
              t = t.replace(old_b, new_b, 1)

          # Foco na lista com retry
          old_f = """            LaunchedEffect(channelListVisible, currentIndex) {
                if (!channelListVisible) return@LaunchedEffect
                runCatching { listState.scrollToItem(currentIndex.coerceIn(0, channelList.lastIndex.coerceAtLeast(0))) }
                delay(120)
                runCatching { firstFocus.requestFocus() }
            }"""
          new_f = """            LaunchedEffect(channelListVisible, currentIndex) {
                if (!channelListVisible) return@LaunchedEffect
                runCatching { listState.scrollToItem(currentIndex.coerceIn(0, channelList.lastIndex.coerceAtLeast(0))) }
                repeat(3) {
                    delay(80)
                    if (runCatching { firstFocus.requestFocus() }.isSuccess) return@LaunchedEffect
                }
            }"""
          if old_f in t:
              t = t.replace(old_f, new_f, 1)

          p.write_text(t)
          assert "deixa Surface/onClick do chip receber OK" in t
          print("ok", len(t))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android-tv/app/src/main/java/com/streamflixvip/tv/ui/livetv/LivePlayerTvScreen.kt
          git commit -m "fix(tv): D-pad OK nos chips + lista focavel + aspecto ciclo" || echo nothing
          git push
