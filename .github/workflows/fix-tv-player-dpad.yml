name: Fix TV Live Player D-pad
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write and run patch script
        run: |
          echo "PLACEHOLDER_B64" | base64 -d > scripts/fix_tv_player_dpad.py
          python3 scripts/fix_tv_player_dpad.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android-tv/app/src/main/java/com/streamflixvip/tv/ui/livetv/LivePlayerTvScreen.kt scripts/fix_tv_player_dpad.py
          git commit -m "fix(tv): D-pad OK nos chips + lista focavel + aspecto ciclo" || echo nothing
          git push
