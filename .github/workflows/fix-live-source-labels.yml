name: fix-live-source-labels

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source visibility
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/livetv/LivePlayerScreen.kt')
          t = p.read_text()
          old = '''                        Text(\n                            buildString {\n                                append(sourceLabel)\n                                if (streams.size > 1) {\n                                    append("  ·  ")\n                                    append(streamIndex + 1)\n                                    append('/')\n                                    append(streams.size)\n                                }\n                            },\n                            color = Color.White.copy(alpha = 0.55f),\n                            fontSize = 12.sp,\n                            maxLines = 1,\n                            overflow = TextOverflow.Ellipsis,\n                        )'''
          new = '''                        Row(\n                            verticalAlignment = Alignment.CenterVertically,\n                            horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        ) {\n                            val isManual = sourceLabel.equals("Manual", ignoreCase = true)\n                            Text(\n                                sourceLabel.ifBlank { "Fonte ${streamIndex + 1}" },\n                                color = if (isManual) Color(0xFF34D399) else Color(0xFFFBBF24),\n                                fontSize = 13.sp,\n                                fontWeight = FontWeight.SemiBold,\n                                maxLines = 1,\n                                overflow = TextOverflow.Ellipsis,\n                            )\n                            if (streams.size > 1) {\n                                Text(\n                                    "${streamIndex + 1}/${streams.size}",\n                                    color = Color.White.copy(alpha = 0.7f),\n                                    fontSize = 12.sp,\n                                    fontWeight = FontWeight.Medium,\n                                )\n                            }\n                        }'''
          if old not in t:
              raise SystemExit('player label missing')
          t = t.replace(old, new, 1)
          old2 = '''                            LiveChip(\n                                icon = Icons.Filled.SwapHoriz,\n                                label = "Fonte",\n                                onClick = {\n                                    streamIndex = (streamIndex + 1) % streams.size\n                                    retryOnSame = 0\n                                    isLoading = true\n                                    errorMessage = null\n                                    controlsVisible = true\n                                },\n                            )'''
          new2 = '''                            LiveChip(\n                                icon = Icons.Filled.SwapHoriz,\n                                label = if (streams.size > 1) {\n                                    "Fonte ${streamIndex + 1}/${streams.size}"\n                                } else {\n                                    "Fonte"\n                                },\n                                onClick = {\n                                    streamIndex = (streamIndex + 1) % streams.size\n                                    retryOnSame = 0\n                                    isLoading = true\n                                    errorMessage = null\n                                    controlsVisible = true\n                                },\n                            )'''
          if old2 not in t:
              raise SystemExit('Fonte chip missing')
          p.write_text(t.replace(old2, new2, 1))
          print('LivePlayerScreen ok')

          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/livetv/LiveTvScreen.kt')
          t = p.read_text()
          old = '''            Text(\n                channel.name,\n                color = Color.White,\n                fontSize = 13.sp,\n                fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )\n            if (selected) {\n                Text("Tocando agora", color = Accent, fontSize = 11.sp)\n            }'''
          new = '''            Text(\n                channel.name,\n                color = Color.White,\n                fontSize = 13.sp,\n                fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )\n            val nSources = channel.streams.size\n            val hasManual = channel.streams.any { it.label.equals("Manual", ignoreCase = true) }\n            when {\n                selected -> Text("Tocando agora", color = Accent, fontSize = 11.sp)\n                nSources > 1 -> Text(\n                    buildString {\n                        append(nSources)\n                        append(" fontes")\n                        if (hasManual) append(" · Manual")\n                    },\n                    color = Color.White.copy(alpha = 0.45f),\n                    fontSize = 11.sp,\n                )\n                hasManual -> Text("Manual", color = Color(0xFF34D399), fontSize = 11.sp)\n            }'''
          if old not in t:
              raise SystemExit('ChannelRow block missing')
          p.write_text(t.replace(old, new, 1))
          print('LiveTvScreen ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/
          git commit -m "feat(tv): indicador de fontes na lista e no player" || echo nothing
          git push
