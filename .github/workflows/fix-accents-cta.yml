name: fix-accents-cta

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-accents-cta.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix accents
        run: |
          python3 << 'END'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt')
          t = p.read_text()
          pairs = [
            ('Este filme ainda nao esta no catalogo',
             'Este filme ainda n\u00e3o est\u00e1 no cat\u00e1logo'),
            ('Quer assistir? Peca no nosso canal e a equipe analisa a inclusao o mais rapido possivel.',
             'Quer assistir? Pe\u00e7a no nosso canal e a equipe analisa a inclus\u00e3o o mais r\u00e1pido poss\u00edvel.'),
          ]
          for a, b in pairs:
              if a in t:
                  t = t.replace(a, b)
                  print('ok', a[:30])
              elif b in t:
                  print('already', b[:30])
              else:
                  print('missing', a[:40])
          p.write_text(t)
          print('DONE')
          END
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          git commit -m "fix(app): acentos no CTA filme sem fonte" || echo nothing
          git push
