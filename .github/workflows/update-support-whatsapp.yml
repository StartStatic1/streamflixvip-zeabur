name: update-support-whatsapp
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_support_whatsapp.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply WhatsApp links
        run: python3 scripts/update_support_whatsapp.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/profile/ProfileScreen.kt \
                  android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat: WhatsApp suporte + comunidade (cinema) no app"
            git push
          fi
