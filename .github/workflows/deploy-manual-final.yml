name: deploy-manual-final

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Join and run do_patch
        run: |
          cat scripts/manual_final/do_p0.py scripts/manual_final/do_p1.py > scripts/manual_final/do_patch.py
          python3 scripts/manual_final/do_patch.py
          grep -c loadManualChannels api/live-tv.js
          grep -c list-live-tv-manual api/admin-vip.js
          grep -c loadLiveTvManuals Public/admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-tv.js api/admin-vip.js Public/admin.html
          git status
          git commit -m "feat: canais manuais TV (.ts/M3U) no painel e na grade" || echo nothing
          git push
