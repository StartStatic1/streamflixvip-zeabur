name: deploy-manual-final

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: python3 scripts/manual_final/assemble.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin-vip.js api/live-tv.js Public/admin.html
          git status
          git commit -m "feat: canais manuais TV (.ts/M3U) no painel e na grade" || echo nothing
          git push
