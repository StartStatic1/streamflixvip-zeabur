name: fix-restore-apis

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          git show 3efed639cd596af502e3a6b0af673e4865e0bfdd:api/live-tv.js > api/live-tv.js
          git show 3efed639cd596af502e3a6b0af673e4865e0bfdd:api/admin-vip.js > api/admin-vip.js
          wc -c api/live-tv.js api/admin-vip.js
          head -3 api/live-tv.js
          grep -c PLACEHOLDER api/live-tv.js api/admin-vip.js || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-tv.js api/admin-vip.js
          git commit -m "fix: restore live-tv.js and admin-vip.js (remove PLACEHOLDER)" || echo nothing
          git push
