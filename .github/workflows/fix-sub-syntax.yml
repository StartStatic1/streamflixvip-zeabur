name: fix-sub-syntax
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_sub_syntax.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply syntax fix
        run: python3 scripts/fix_sub_syntax.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix: sintaxe applyOnlineSubtitle (WEBVTT)"
            git push
          fi
