name: fix-movie-cta2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-movie-cta2.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 << 'END'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt')
          t = p.read_text()
          if '__MOVIE_CTA__' in t:
              t2, n = re.subn(
                  r'item \{\s*Text\(\s*"__MOVIE_CTA__",.*?\)\s*\}',
                  'item {\n                    MovieRequestCard()\n                }',
                  t,
                  count=1,
                  flags=re.S,
              )
              print('replacements', n)
              if n != 1:
                  raise SystemExit('failed')
              t = t2
          elif 'MovieRequestCard()' in t:
              print('already')
          else:
              raise SystemExit('no marker')
          p.write_text(t)
          print('OK')
          END
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          git commit -m "fix(app): usar MovieRequestCard no filme sem fonte" || echo nothing
          git push
