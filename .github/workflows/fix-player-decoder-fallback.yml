name: fix-player-decoder-fallback
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_player_decoder_fallback.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt
          git commit -m "fix(player): decoder fallback para aparelhos sem codec" || exit 0
          git push
