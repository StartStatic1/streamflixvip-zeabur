name: Fix Mobile In-App Update
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix FileProvider authority in Manifest
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          # Corrigir $$ residual do GHA e garantir authority correta
          sed -i 's|android:authorities="\$\${applicationId}.fileprovider"|android:authorities="com.streamflixvip.app.fileprovider"|g' "$MAN"
          sed -i 's|android:authorities="\${applicationId}.fileprovider"|android:authorities="com.streamflixvip.app.fileprovider"|g' "$MAN"
          sed -i 's|android:authorities="\$applicationId.fileprovider"|android:authorities="com.streamflixvip.app.fileprovider"|g' "$MAN"
          grep -n fileprovider "$MAN"

      - name: Fix MainActivity download + show errors
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = p.read_text()

          # Garantir imports
          if "import androidx.compose.runtime.rememberCoroutineScope" not in t:
              t = t.replace(
                  "import androidx.compose.runtime.setValue",
                  "import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.rememberCoroutineScope",
                  1,
              )
          if "import kotlinx.coroutines.launch" not in t:
              t = t.replace(
                  "import androidx.compose.runtime",
                  "import kotlinx.coroutines.launch\nimport androidx.compose.runtime",
                  1,
              )

          # Adicionar scope e error state perto de isDownloadingUpdate
          if "var updateError" not in t:
              t = t.replace(
                  "var isDownloadingUpdate by remember { mutableStateOf(false) }",
                  "var isDownloadingUpdate by remember { mutableStateOf(false) }\n"
                  "    var updateError by remember { mutableStateOf<String?>(null) }\n"
                  "    val updateScope = rememberCoroutineScope()",
                  1,
              )

          # Substituir onDownloadClick inteiro por versao robusta
          start = t.find("            onDownloadClick = {")
          if start < 0:
              raise SystemExit("onDownloadClick not found")
          # achar o fechamento do lambda no nivel correto (linha com so "            },")
          end = t.find("\n            },", start)
          if end < 0:
              raise SystemExit("onDownloadClick end not found")
          end = t.find("\n", end + 1)  # include the }, line end

          new = '''            onDownloadClick = {
                val url = updateInfo!!.apkUrl
                if (url.isBlank()) {
                    updateError = "URL de atualizacao vazia"
                    return@UpdateRequiredScreen
                }
                updateError = null
                isDownloadingUpdate = true
                updateScope.launch {
                    try {
                        if (!com.streamflixvip.app.update.ApkInstaller.canInstallPackages(context)) {
                            com.streamflixvip.app.update.ApkInstaller.openInstallPermissionSettings(context)
                            updateError = "Ative 'Permitir desta fonte' e toque de novo em Baixar"
                            return@launch
                        }
                        val file = com.streamflixvip.app.update.ApkInstaller.download(context, url) { }
                        com.streamflixvip.app.update.ApkInstaller.install(context, file)
                    } catch (e: Exception) {
                        updateError = e.message ?: "Falha no download/instalacao"
                    } finally {
                        isDownloadingUpdate = false
                    }
                }
            },'''
          t = t[:start] + new + t[end:]

          # Passar updateError para a tela se a assinatura permitir - senao mostrar Text abaixo
          # Por simplicidade, injeta um Toast/nao - a UpdateRequiredScreen nao tem error param.
          # Adiciona apos UpdateRequiredScreen um Text se updateError != null - mais complexo.
          # Em vez disso, usa android.widget.Toast no catch (ja tratado acima via updateError).
          # Mostrar Toast no catch tambem:
          t = t.replace(
              "updateError = e.message ?: \"Falha no download/instalacao\"",
              "updateError = e.message ?: \"Falha no download/instalacao\"\n"
              "                        android.widget.Toast.makeText(context, updateError, android.widget.Toast.LENGTH_LONG).show()",
              1,
          )
          t = t.replace(
              'updateError = "Ative \'Permitir desta fonte\' e toque de novo em Baixar"',
              'updateError = "Ative permitir desta fonte e toque Baixar de novo"\n'
              '                            android.widget.Toast.makeText(context, updateError, android.widget.Toast.LENGTH_LONG).show()',
              1,
          )

          p.write_text(t)
          print("MainActivity ok")
          PY

      - name: Fix UpdateRequiredScreen footer text
        run: |
          FILE=android/app/src/main/java/com/streamflixvip/app/ui/update/UpdateRequiredScreen.kt
          sed -i 's|O download abre no seu navegador. Depois de instalar, abra o app de novo.|O download acontece dentro do app. Se pedir permissao, ative e toque Baixar de novo.|g' "$FILE"
          grep -n 'download' "$FILE" | head -5

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): FileProvider authority + update in-app com erro visivel" || echo nothing
          git push
