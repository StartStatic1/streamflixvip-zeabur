name: fix-server-sheet-scroll
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_server_sheet_scroll.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_server_sheet_scroll.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix: sheet servidores com scroll e padding inferior"
            git push
          fi
