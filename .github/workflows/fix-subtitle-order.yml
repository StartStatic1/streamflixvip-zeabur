name: Fix Subtitle Function Order
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move autoload after function defs
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt")
          t = p.read_text()

          # Remove early LaunchedEffect block (before exoPlayer)
          old = '''
    // Reaplica legenda online salva (filesDir) sem baixar de novo
    LaunchedEffect(activeUrl, tmdbId, currentSeason, currentEpisode) {
        val file = subtitleCacheFile()
        val label = loadSavedSubtitleLabel()
        if (file.exists() && file.length() > 10L && !label.isNullOrBlank()) {
            // espera player ter fonte
            kotlinx.coroutines.delay(600)
            try {
                applySubtitleFromFile(file, label)
            } catch (_: Exception) {
            }
        }
    }
'''
          if old not in t:
              # try without leading newline variants
              if "Reaplica legenda online salva" not in t:
                  print("no early block - ok?")
              else:
                  # line-based removal
                  lines = t.splitlines(True)
                  out = []
                  i = 0
                  while i < len(lines):
                      if "Reaplica legenda online salva" in lines[i]:
                          # skip comment and LaunchedEffect until closing brace at column of LaunchedEffect
                          # remove previous empty line if any already added
                          while out and out[-1].strip() == "":
                              out.pop()
                          # skip until we close the LaunchedEffect - find "LaunchedEffect" then match braces
                          while i < len(lines) and "LaunchedEffect" not in lines[i]:
                              i += 1
                          if i < len(lines):
                              depth = 0
                              started = False
                              while i < len(lines):
                                  for ch in lines[i]:
                                      if ch == '{':
                                          depth += 1
                                          started = True
                                      elif ch == '}':
                                          depth -= 1
                                  i += 1
                                  if started and depth <= 0:
                                      break
                          continue
                      out.append(lines[i])
                      i += 1
                  t = "".join(out)
                  print("removed early block line-based")
          else:
              t = t.replace(old, "\n", 1)
              print("removed early block")

          # Insert after applyOnlineSubtitle function ends - look for "suspend fun applyOnlineSubtitle"
          # and find the closing of that function, then insert
          if "Reaplica legenda online salva" not in t:
              marker = "    fun selectAudio(option: TrackOption?)"
              if marker not in t:
                  raise SystemExit("selectAudio marker missing")
              inject = '''
    // Reaplica legenda online salva (filesDir) sem baixar de novo
    LaunchedEffect(activeUrl, tmdbId, currentSeason, currentEpisode) {
        val file = subtitleCacheFile()
        val label = loadSavedSubtitleLabel()
        if (file.exists() && file.length() > 10L && !label.isNullOrBlank()) {
            kotlinx.coroutines.delay(800)
            try {
                applySubtitleFromFile(file, label)
            } catch (_: Exception) {
            }
        }
    }

'''
              t = t.replace(marker, inject + marker, 1)
              print("inserted after helpers")
          else:
              print("autoload already present later")

          p.write_text(t)
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt
          git commit -m "fix(mobile): LaunchedEffect legenda apos definicao das funcoes" || echo nothing
          git push
