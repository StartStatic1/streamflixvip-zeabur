name: apply-reels-app
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_reels_app.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/network/NetworkModule.kt android/app/src/main/java/com/streamflixvip/app/MainActivity.kt android/app/build.gradle.kts
          if git diff --cached --quiet; then echo nochange; else
            git commit -m "feat: liga aba e player de reels"
            git push
          fi
