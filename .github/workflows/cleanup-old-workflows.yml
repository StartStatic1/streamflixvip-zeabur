name: cleanup-old-workflows
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cleanup_old_workflows.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add -A .github/workflows
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore: remove workflows one-shot (mantem build/release/sync)"
            git push
          fi
