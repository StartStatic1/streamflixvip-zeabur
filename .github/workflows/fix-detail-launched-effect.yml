name: Fix DetailScreen LaunchedEffect Import
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add LaunchedEffect import
        run: |
          FILE=android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          if ! grep -q 'import androidx.compose.runtime.LaunchedEffect' "$FILE"; then
            sed -i 's|import androidx.compose.runtime.Composable|import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect|' "$FILE"
          fi
          grep -n 'LaunchedEffect' "$FILE" | head -5
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          git commit -m "fix(mobile): import LaunchedEffect no DetailScreen" || echo nothing
          git push
