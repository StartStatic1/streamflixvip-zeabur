name: Fix Continue Watching Params
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pass resume params to DetailScreen
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = p.read_text()
          # Achar a chamada com viewModel (nao GenreDetailScreen)
          marker = "DetailScreen(\n                    viewModel = viewModel,\n                    onPlaySource"
          if "resumeSeconds = resumeSeconds" in t and marker.replace("onPlaySource", "resumeSeconds") in t.replace(" ", ""):
              pass
          idx = 0
          found = -1
          while True:
              i = t.find("DetailScreen(", idx)
              if i < 0:
                  break
              snippet = t[i:i+120]
              if "viewModel = viewModel" in snippet and "resumeSeconds = resumeSeconds" not in snippet:
                  found = i
                  break
              idx = i + 1
          if found < 0:
              if "resumeSeconds = resumeSeconds" in t:
                  print("already patched")
                  raise SystemExit(0)
              raise SystemExit("DetailScreen(viewModel) not found")
          # Inserir apos a linha viewModel = viewModel,
          insert_at = t.find("\n", t.find("viewModel = viewModel", found)) + 1
          extra = (
              "                    resumeSeconds = resumeSeconds,\n"
              "                    initialSeason = initialSeason,\n"
              "                    initialEpisode = initialEpisode,\n"
          )
          t = t[:insert_at] + extra + t[insert_at:]
          p.write_text(t)
          print("patched at", found)
          print(t[found:found+320])
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/MainActivity.kt
          git commit -m "fix(mobile): passar resume/season/episode ao DetailScreen" || echo nothing
          git push
