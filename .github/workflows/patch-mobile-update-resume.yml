name: Patch Mobile Update + Resume
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy ApkInstaller and paths
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/streamflixvip/app/update
          mkdir -p android/app/src/main/res/xml
          sed -e 's/com.streamflixvip.tv.update/com.streamflixvip.app.update/g' \
              -e 's/StreamFlixVIP-TV-Updater/StreamFlixVIP-Mobile-Updater/g' \
              -e 's/streamflix-tv-update.apk/streamflix-update.apk/g' \
              android-tv/app/src/main/java/com/streamflixvip/tv/update/ApkInstaller.kt \
              > android/app/src/main/java/com/streamflixvip/app/update/ApkInstaller.kt
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '    <cache-path name="apk_cache" path="." />' '    <files-path name="apk_files" path="." />' '    <external-cache-path name="apk_ext_cache" path="." />' '    <external-files-path name="apk_ext_files" path="." />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          if ! grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml; then
            sed -i 's|android.permission.WAKE_LOCK" />|android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />|' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q fileprovider android/app/src/main/AndroidManifest.xml; then
            sed -i 's|    </application>|        <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>\n    </application>|' android/app/src/main/AndroidManifest.xml
          fi
          head -2 android/app/src/main/java/com/streamflixvip/app/update/ApkInstaller.kt

      - name: Patch MainActivity and DetailScreen
        run: python3 scripts/patch_mobile_update_resume_core.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "feat(mobile): update in-app + continuar assistindo no player" || echo nothing
          git push
