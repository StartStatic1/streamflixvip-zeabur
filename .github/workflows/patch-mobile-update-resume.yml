name: Patch Mobile Update + Resume
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode script and apply
        run: |
          set -e
          cat scripts/mur.b64.0 scripts/mur.b64.1 scripts/mur.b64.2 scripts/mur.b64.3 | base64 -d > scripts/patch_mobile_update_resume.py
          python3 scripts/patch_mobile_update_resume.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/ scripts/patch_mobile_update_resume.py
          git commit -m "feat(mobile): update in-app + continuar assistindo no player" || echo nothing
          git push
