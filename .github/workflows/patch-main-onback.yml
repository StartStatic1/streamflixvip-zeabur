name: patch-main-onback
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore MainActivity and wire onBack
        run: |
          set -eux
          MAIN=android/app/src/main/java/com/streamflixvip/app/MainActivity.kt
          git show 75168551d5f28343662f037732f2c29faf2bd356:"$MAIN" > "$MAIN"
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/streamflixvip/app/MainActivity.kt")
          t = p.read_text()
          assert "fun MainActivity" in t or "class MainActivity" in t
          assert "sourceUrl = url" in t
          if "onBack = { navController.popBackStack() }" not in t.split("sourceUrl = url", 1)[1][:400]:
              old = "isDirectPlayable = isDirect,\n                        userId = userId,"
              new = "isDirectPlayable = isDirect,\n                        onBack = { navController.popBackStack() },\n                        userId = userId,"
              if old not in t:
                  raise SystemExit("pattern not found")
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("inserted")
          else:
              print("already present")
          t2 = p.read_text()
          chunk = t2.split("sourceUrl = url", 1)[1][:400]
          assert "onBack = { navController.popBackStack() }" in chunk, chunk
          print("OK", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/MainActivity.kt
          git commit -m "fix(player): MainActivity onBack no PlayerScreen VOD" || exit 0
          git push
