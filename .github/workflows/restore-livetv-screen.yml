name: Restore Live TV Screen Sidebar
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore Screen
        run: python3 scripts/apply_livetv_screen_chunks.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/livetv/LiveTvScreen.kt
          git commit -m "fix(livetv): sidebar esquerda Telecine HBO Premiere Discovery" || echo nothing
          git push
