name: Fix Mobile Update Progress
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch update UI and download flow
        run: python3 scripts/fix_mobile_update_progress.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/
          git commit -m "fix(mobile): progresso download + fallback navegador" || echo nothing
          git push
