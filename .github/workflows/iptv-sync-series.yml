name: Sincronização IPTV — Séries (standalone)

on:
  schedule:
    - cron: '15 */1 * * *'
  workflow_dispatch: {}

concurrency:
  group: iptv-sync-series
  cancel-in-progress: false

jobs:
  sync-series:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar sincronização de SÉRIES
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node sync-series-standalone.js

      - name: Manter só as 2 melhores fontes por episódio
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "https://gkujbjpvphuvrejpvvtz.supabase.co/rest/v1/rpc/enforce_max_sources_per_episode" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"max_count": 2}'
