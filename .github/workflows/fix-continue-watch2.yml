name: fix-continue-watch2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-continue-watch2.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          echo '' | base64 -d > apply.py
          python3 apply.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/
          git commit -m "fix(app): progresso no embed + limiar 10s" || echo nothing
          git push
