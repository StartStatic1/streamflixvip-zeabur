name: Fix Admin Source Id
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Accept sourceId and isActive aliases
        run: |
          FILE=api/admin-vip.js
          python3 << 'PY'
          from pathlib import Path
          p = Path("api/admin-vip.js")
          t = p.read_text()

          old_toggle = """  if (action === 'toggle-source') {
    const { id, is_active } = body;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/vip_sources?id=eq.${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: { ...svcHeaders, Prefer: 'return=representation' },
      body: JSON.stringify({ is_active: !!is_active }),
    });"""

          new_toggle = """  if (action === 'toggle-source') {
    const id = body.id || body.sourceId;
    const is_active = body.is_active !== undefined ? body.is_active : body.isActive;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/vip_sources?id=eq.${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: { ...svcHeaders, Prefer: 'return=representation' },
      body: JSON.stringify({ is_active: !!is_active }),
    });"""

          old_del = """  if (action === 'delete-source') {
    const { id } = body;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }"""

          new_del = """  if (action === 'delete-source') {
    const id = body.id || body.sourceId;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }"""

          if old_toggle not in t:
              raise SystemExit('toggle block not found')
          if old_del not in t:
              raise SystemExit('delete block not found')
          t = t.replace(old_toggle, new_toggle, 1).replace(old_del, new_del, 1)

          # update-source also
          old_up = """  if (action === 'update-source') {
    const { id, source_url, source_label, priority, season, episode, title } = body;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }"""
          new_up = """  if (action === 'update-source') {
    const id = body.id || body.sourceId;
    const { source_url, source_label, priority, season, episode, title } = body;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }"""
          if old_up in t:
              t = t.replace(old_up, new_up, 1)
              print('update-source ok')

          p.write_text(t)
          print('DONE')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add api/admin-vip.js
          git commit -m "fix(api): aceitar sourceId/isActive no toggle e delete de fonte" || echo nothing
          git push
