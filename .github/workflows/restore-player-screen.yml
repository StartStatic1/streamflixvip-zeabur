name: Restore PlayerScreen
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ps_gz.b64'
      - 'scripts/restore_player_gz.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore PlayerScreen.kt
        run: python3 scripts/restore_player_gz.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt
          git diff --staged --quiet || git commit -m "fix(player): legenda/audio/fonte persistem entre episodios"
          git push
