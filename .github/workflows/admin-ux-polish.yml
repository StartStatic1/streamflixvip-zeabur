name: admin-ux-polish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-ux-polish.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          echo '' | base64 -d > apply.py
          python3 apply.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Public/admin.html
          git commit -m "ui(admin): botoes 3D, dashboard confiavel, busca TMDB mais estavel" || echo nothing
          git push
