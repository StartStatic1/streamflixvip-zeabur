name: Fix Favorites Crash
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 scripts/fix_favorites_crash.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android/app/src/main/java/com/streamflixvip/app/ui/mylist/MyListScreen.kt android/app/src/main/java/com/streamflixvip/app/MainActivity.kt
          git diff --cached --stat
          git commit -m "fix(mobile): crash LocalLifecycleOwner nos favoritos" || echo "nothing"
          git push
