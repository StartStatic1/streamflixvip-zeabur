name: feat-block-and-nosource

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/feat-block-and-nosource.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # --- SQL doc ---
          Path('sql').mkdir(exist_ok=True)
          Path('sql/vip_source_blocks.sql').write_text('''-- Rode no Supabase SQL Editor
create table if not exists public.vip_source_blocks (
  id uuid primary key default gen_random_uuid(),
  tmdb_id integer not null,
  media_type text not null check (media_type in ('movie','tv')),
  season integer null,
  episode integer null,
  source_label text null,
  source_url text null,
  created_at timestamptz not null default now()
);

create index if not exists vip_source_blocks_tmdb_idx
  on public.vip_source_blocks (tmdb_id, media_type);

-- service role only (painel/sync); sem policy publica
alter table public.vip_source_blocks enable row level security;
''')
          print('sql ok')

          # --- admin-vip delete-source: block + delete ---
          p = Path('api/admin-vip.js')
          t = p.read_text()
          if len(t) < 10000:
              raise SystemExit('admin-vip too small')
          old_del = """  if (action === 'delete-source') {
    const id = body.id || body.sourceId;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/vip_sources?id=eq.${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: svcHeaders,
    });
    if (!r.ok) { res.status(502).json({ error: 'Erro ao excluir fonte', detail: await r.text() }); return; }
    res.status(200).json({ success: true });
    return;
  }"""
          new_del = r'''  if (action === 'delete-source') {
    const id = body.id || body.sourceId;
    if (!id) { res.status(400).json({ error: 'Informe id' }); return; }
    // Le a fonte antes de apagar pra registrar bloqueio (sync nao recria)
    let blocked = null;
    try {
      const getR = await fetch(
        SUPABASE_URL + '/rest/v1/vip_sources?id=eq.' + encodeURIComponent(id) + '&select=tmdb_id,media_type,season,episode,source_label,source_url&limit=1',
        { headers: svcHeaders },
      );
      if (getR.ok) {
        const rows = await getR.json();
        const src = Array.isArray(rows) ? rows[0] : null;
        if (src && src.tmdb_id != null) {
          const blockPayload = {
            tmdb_id: Number(src.tmdb_id),
            media_type: src.media_type || 'movie',
            season: src.season != null ? Number(src.season) : null,
            episode: src.episode != null ? Number(src.episode) : null,
            source_label: src.source_label != null ? String(src.source_label) : null,
            source_url: src.source_url != null ? String(src.source_url) : null,
          };
          const br = await fetch(SUPABASE_URL + '/rest/v1/vip_source_blocks', {
            method: 'POST',
            headers: { ...svcHeaders, Prefer: 'return=minimal' },
            body: JSON.stringify(blockPayload),
          });
          blocked = br.ok;
          if (!br.ok) console.warn('[admin-vip] block insert', await br.text());
        }
      }
    } catch (e) { console.warn('[admin-vip] block', e.message); }
    const r = await fetch(SUPABASE_URL + '/rest/v1/vip_sources?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: svcHeaders,
    });
    if (!r.ok) { res.status(502).json({ error: 'Erro ao excluir fonte', detail: await r.text() }); return; }
    res.status(200).json({ success: true, blocked: !!blocked });
    return;
  }'''
          if old_del in t:
              t = t.replace(old_del, new_del, 1)
              p.write_text(t)
              print('admin delete-source patched')
          elif 'vip_source_blocks' in t:
              print('admin already has blocks')
          else:
              print('WARN admin delete pattern missing')

          # --- media-sources: list episodes with sources ---
          p = Path('api/media-sources.js')
          t = p.read_text()
          if 'episodesWithSources' not in t:
              # insert helper before handler export logic
              helper = r'''
async function loadEpisodesWithSources(serviceKey, tmdbId, season) {
  const q =
    SUPABASE_URL + '/rest/v1/vip_sources?tmdb_id=eq.' + encodeURIComponent(tmdbId) +
    '&media_type=eq.tv&is_active=eq.true&season=eq.' + encodeURIComponent(season) +
    '&select=episode';
  const r = await fetch(q, { headers: sbHeaders(serviceKey) });
  if (!r.ok) throw new Error('vip_sources episodes ' + r.status);
  const rows = await r.json();
  const set = new Set();
  (Array.isArray(rows) ? rows : []).forEach((row) => {
    if (row.episode != null) set.add(Number(row.episode));
  });
  return [...set].filter((n) => Number.isFinite(n)).sort((a, b) => a - b);
}

'''
              t = t.replace('async function loadSources(', helper + 'async function loadSources(', 1)
              # after parsing episode, before VIP checks - add early return for list mode
              needle = '  const hard = isMediaAuthHard();'
              insert = '''  // Modo lista: quais EPs da temporada tem fonte (app marca "Sem fonte")
  if (String(req.query.list_episodes || '') === '1' && mediaType === 'tv' && season != null) {
    try {
      const episodesWithSources = await loadEpisodesWithSources(serviceKey, tmdbId, season);
      res.status(200).json({ sources: [], episodesWithSources });
    } catch (err) {
      console.error('[media-sources] list_episodes', err);
      res.status(500).json({ error: err.message || 'Erro', sources: [], episodesWithSources: [] });
    }
    return;
  }

  const hard = isMediaAuthHard();'''
              if needle not in t:
                  raise SystemExit('hard needle missing')
              t = t.replace(needle, insert, 1)
              p.write_text(t)
              print('media-sources list_episodes ok')
          else:
              print('media-sources already has list')

          # --- sync-standalone: skip blocked ---
          def patch_sync(path):
              p = Path(path)
              if not p.exists():
                  print('skip', path)
                  return
              t = p.read_text()
              if 'vip_source_blocks' in t and 'isBlockedSource' in t:
                  print(path, 'already')
                  return
              helper = r'''
async function loadSourceBlocks(serviceKey) {
  try {
    const rows = await sbSelect(serviceKey, 'vip_source_blocks', 'select=tmdb_id,media_type,season,episode,source_label,source_url&limit=20000');
    return Array.isArray(rows) ? rows : [];
  } catch (e) {
    console.warn('[sync] vip_source_blocks indisponivel:', e.message || e);
    return [];
  }
}
function isBlockedSource(blocks, row) {
  if (!blocks || !blocks.length) return false;
  const tid = Number(row.tmdb_id);
  const mt = row.media_type;
  const season = row.season != null ? Number(row.season) : null;
  const episode = row.episode != null ? Number(row.episode) : null;
  const label = row.source_label != null ? String(row.source_label) : null;
  const url = row.source_url != null ? String(row.source_url) : null;
  for (const b of blocks) {
    if (Number(b.tmdb_id) !== tid) continue;
    if ((b.media_type || '') !== mt) continue;
    const bs = b.season != null ? Number(b.season) : null;
    const be = b.episode != null ? Number(b.episode) : null;
    if (bs !== season) continue;
    if (be !== episode) continue;
    // label null no block = bloqueia qualquer label desse titulo/ep
    if (b.source_label == null || b.source_label === '') return true;
    if (label && String(b.source_label) === label) return true;
    if (url && b.source_url && String(b.source_url) === url) return true;
  }
  return false;
}

'''
              # inject after first function definition area - after sbUpsert if present
              if 'async function sbUpsert' in t:
                  t = t.replace('async function sbUpsert', helper + 'async function sbUpsert', 1)
              elif 'function sbUpsert' in t:
                  t = t.replace('function sbUpsert', helper + 'function sbUpsert', 1)
              else:
                  t = helper + t
              # before each await sbUpsert(... vip_sources filter rows
              # simpler: wrap filter right before sbUpsert of vip_sources
              t2 = re.sub(
                  r"(await sbUpsert\(serviceKey, 'vip_sources', )(vipSourcesRows)(,",
                  r"\1(vipSourcesRows.filter((row) => !isBlockedSource(_sourceBlocks, row)))\3",
                  t,
              )
              if t2 == t:
                  print('WARN no vipSourcesRows upsert in', path)
              else:
                  t = t2
              # load blocks at start of main sync loop if we can find a good place
              if 'const _sourceBlocks' not in t:
                  # inject at beginning of processSource or main
                  if 'async function processSource' in t:
                      t = t.replace(
                          'async function processSource',
                          'let _sourceBlocks = [];\nasync function processSource',
                          1,
                      )
                  if 'async function main' in t:
                      t = t.replace(
                          'async function main',
                          'async function main',
                          1,
                      )
                      # after main starts load blocks
                      t = re.sub(
                          r'(async function main\(\) \{[\s\S]*?\n)',
                          r'\1  _sourceBlocks = await loadSourceBlocks(serviceKey || process.env.SUPABASE_SERVICE_ROLE_KEY);\n  console.log("[sync] blocks:", _sourceBlocks.length);\n',
                          t,
                          count=1,
                      )
                  # alternative: load before first upsert batch
                  if '_sourceBlocks = await loadSourceBlocks' not in t:
                      t = t.replace(
                          "await sbUpsert(serviceKey, 'vip_sources',",
                          "if (!_sourceBlocks.length) { try { _sourceBlocks = await loadSourceBlocks(serviceKey); } catch(_) {} }\n      await sbUpsert(serviceKey, 'vip_sources',",
                          1,
                      )
              p.write_text(t)
              print('patched', path)

          patch_sync('sync-standalone.js')
          patch_sync('xtream-sync-standalone.js')

          # --- Android MediaSourcesApi ---
          p = Path('android/app/src/main/java/com/streamflixvip/app/network/MediaSourcesApi.kt')
          t = p.read_text()
          if 'episodesWithSources' not in t:
              t = t.replace(
                  'val code: String? = null,\n)',
                  'val code: String? = null,\n    val episodesWithSources: List<Int> = emptyList(),\n)',
                  1,
              )
              t = t.replace(
                  '''    suspend fun getEpisodeSources(
        @Query("tmdb_id") tmdbId: Int,
        @Query("type") type: String = "tv",
        @Query("season") season: Int,
        @Query("episode") episode: Int,
    ): MediaSourcesResponse
}''',
                  '''    suspend fun getEpisodeSources(
        @Query("tmdb_id") tmdbId: Int,
        @Query("type") type: String = "tv",
        @Query("season") season: Int,
        @Query("episode") episode: Int,
    ): MediaSourcesResponse

    @GET("api/media-sources")
    suspend fun getSeasonEpisodesWithSources(
        @Query("tmdb_id") tmdbId: Int,
        @Query("type") type: String = "tv",
        @Query("season") season: Int,
        @Query("list_episodes") listEpisodes: Int = 1,
    ): MediaSourcesResponse
}''',
                  1,
              )
              p.write_text(t)
              print('MediaSourcesApi ok')
          else:
              print('MediaSourcesApi already')

          # --- DetailViewModel: track episodesWithSources ---
          p = Path('android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailViewModel.kt')
          t = p.read_text()
          if 'episodesWithSources' not in t:
              t = t.replace(
                  'val isFavorite: Boolean = false,\n        val isTogglingFavorite: Boolean = false,\n    ) : DetailUiState {',
                  'val isFavorite: Boolean = false,\n        val isTogglingFavorite: Boolean = false,\n        /** Episodios da temporada expandida que tem pelo menos 1 fonte ativa. null = ainda nao carregou. */\n        val episodesWithSources: Set<Int>? = null,\n    ) : DetailUiState {',
                  1,
              )
              # when loading season episodes also fetch list
              old_load = '''            val episodes = repository.getSeasonEpisodes(tmdbId, season)
            val stillCurrent = _uiState.value as? DetailUiState.Success ?: return@launch
            if (stillCurrent.expandedSeason == season) {
                _uiState.value = stillCurrent.copy(episodesOfExpandedSeason = episodes, isLoadingEpisodes = false)
            }'''
              # may appear twice - expandSeason and resume
              if old_load not in t:
                  # try variant without stillCurrent check exact
                  print('WARN episode load block variant')
                  print('--- snippet ---')
                  idx = t.find('getSeasonEpisodes')
                  print(repr(t[idx:idx+350]) if idx>=0 else 'none')
              else:
                  new_load = '''            val episodes = repository.getSeasonEpisodes(tmdbId, season)
            var withSources: Set<Int>? = null
            try {
                val resp = NetworkModule.mediaSourcesApi.getSeasonEpisodesWithSources(tmdbId = tmdbId, season = season)
                withSources = resp.episodesWithSources.toSet()
            } catch (_: Exception) {
                withSources = null
            }
            val stillCurrent = _uiState.value as? DetailUiState.Success ?: return@launch
            if (stillCurrent.expandedSeason == season) {
                _uiState.value = stillCurrent.copy(
                    episodesOfExpandedSeason = episodes,
                    isLoadingEpisodes = false,
                    episodesWithSources = withSources,
                )
            }'''
                  t = t.replace(old_load, new_load)  # all occurrences
                  p.write_text(t)
                  print('DetailViewModel patched')
          else:
              print('DetailViewModel already')

          # ensure NetworkModule has mediaSourcesApi
          nm = Path('android/app/src/main/java/com/streamflixvip/app/network/NetworkModule.kt').read_text()
          if 'mediaSourcesApi' not in nm:
              print('WARN mediaSourcesApi name may differ')
          else:
              print('NetworkModule has mediaSourcesApi')

          print('DONE')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat: bloqueio de fontes excluidas no sync + list_episodes sem fonte" || echo nothing
          git push
