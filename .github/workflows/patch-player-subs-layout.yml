name: patch-player-subs-layout
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch subtitles + layout
        run: python3 scripts/patch_player_subs_layout.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/player/PlayerScreen.kt
          git status
          git commit -m "feat(player): legendas online + labels legiveis + barra inferior" || exit 0
          git push
