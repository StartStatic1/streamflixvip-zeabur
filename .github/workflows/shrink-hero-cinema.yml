name: shrink-hero-cinema
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/shrink_hero_cinema.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/shrink_hero_cinema.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "ux: card sessao menor e textos"
            git push
          fi
