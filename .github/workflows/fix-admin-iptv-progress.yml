name: fix-admin-iptv-progress
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Patch admin progress label
        run: python3 scripts/patch_admin_progress.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Public/admin.html
          git diff --cached --stat
          git commit -m "fix(admin): progresso IPTV sem undefined (aceita campos legados)" || echo "nothing"
          git push
