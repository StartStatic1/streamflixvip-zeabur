name: Build Android APK - Debug (StreamFlixVIP)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/patch_detail_cast.py'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Ligar gêneros e elenco na tela de detalhes
        working-directory: .
        run: python3 scripts/patch_detail_cast.py

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar wrapper do Gradle (versão fixa 8.7)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Restaurar keystore fixa (evita conflito de assinatura ao instalar por cima)
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Buildar APK de debug (rápido, só pra testar — não publica)
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: streamflixvip123
          DEBUG_KEY_ALIAS: streamflixvip-debug
          DEBUG_KEY_PASSWORD: streamflixvip123
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
