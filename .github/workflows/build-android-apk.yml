name: Build Android APK - Debug (StreamFlixVIP)

# Roda SOZINHO a cada push que mexe em android/ — é o seu fluxo de
# sempre pra testar mudanças rapidamente (corrigir bug, subir pelo
# Termux, baixar o APK gerado aqui no Actions). Não mexe em versão,
# não publica no site, não faz commit — só builda e disponibiliza
# pra download como artefato, igual sempre funcionou.
#
# Pra PUBLICAR oficialmente uma nova versão pros usuários (a que o
# app vai detectar e pedir pra atualizar), use o outro workflow:
# "Build Android APK - Release (Publicar)", que precisa ser acionado
# manualmente na aba Actions.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pula esta run se o push veio do commit automático do workflow de
    # release (mensagens "release: v...") — nesse caso o release já foi
    # buildado, rodar o debug de novo em cima seria só gastar minutos
    # do Actions à toa.
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar wrapper do Gradle (versão fixa 8.7)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Restaurar keystore fixa (evita conflito de assinatura ao instalar por cima)
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Buildar APK de debug (rápido, só pra testar — não publica)
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: streamflixvip123
          DEBUG_KEY_ALIAS: streamflixvip-debug
          DEBUG_KEY_PASSWORD: streamflixvip123
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
