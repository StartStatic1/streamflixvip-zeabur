name: Build Android APK (StreamFlixVIP)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar wrapper do Gradle (versão fixa 8.7)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Buildar APK de debug (instalável direto, sem assinatura de loja)
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: streamflixvip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
