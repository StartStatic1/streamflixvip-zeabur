name: polish-hero-bar
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/polish_hero_bar.py
      - name: Commit
        run: |
          git config user.name "streamflix-bot"
          git config user.email "bot@streamflix.local"
          git add android/app/src/main/java/com/streamflixvip/app/ui/detail/DetailScreen.kt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "fix: barra da sessao enche ate o fim e frases cinema"
            git push
          fi
