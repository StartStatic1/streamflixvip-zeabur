name: fix-extinf-parser

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          patch -p1 < scripts/manual_final/extinf-fix.patch
          grep -c sameLineUrl api/admin-vip.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin-vip.js
          git commit -m "fix: parser EXTINF URL na mesma linha e group-title" || echo nothing
          git push
