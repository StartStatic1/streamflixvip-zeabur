name: fix-pix-spacer-once
on:
  push:
    paths:
      - '.github/workflows/fix-pix-spacer-once.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Spacer typo
        run: |
          set -e
          F=android/app/src/main/java/com/streamflixvip/app/ui/vip/PixPaymentSheet.kt
          if grep -q 'Spacer(modifier\.height' "$F"; then
            sed -i 's/Spacer(modifier\.height/Spacer(Modifier.height/g' "$F"
            git config user.name "streamflix-bot"
            git config user.email "bot@streamflixvip.online"
            git add "$F"
            git commit -m "fix(vip): Spacer(Modifier.height) in PixPaymentSheet"
            git push
            echo FIXED
          else
            echo already ok
          fi
