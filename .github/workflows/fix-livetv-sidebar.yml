name: Fix Live TV Sidebar
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        run: python3 scripts/fix_livetv_sidebar.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/com/streamflixvip/app/ui/livetv/
          git commit -m "fix(livetv): categorias esquerda + lista direita" || echo nothing
          git push
